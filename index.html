        <div style="font-size:15px;color:var(--mute);line-height:1.6">
          Add your take-home income and every figure in this app gains a denominator —
          savings rate, what share your commitments take, and what is genuinely free to spend.
        </div>
        <button class="save" id="incBtn" style="margin:20px 0 0;width:100%">Set your income</button>
      </div>
    </div>
    <div class="hint" style="padding:0 18px;margin-top:14px">Stored on this device only, like everything else here. It never leaves the phone.</div>`;

  const months=[...new Set(live().map(e=>monKey(e.spent_on)))].sort().reverse();
  if(!months.includes(S.insMonth))S.insMonth=months[0]||monKey(today());
  const k=S.insMonth;
  const m=moneyFor(k);
  const hist=savingsHistory(12);
  const withRate=hist.filter(h=>h.rate!==null);
  const avgRate=withRate.length?withRate.reduce((s,h)=>s+h.rate,0)/withRate.length:null;
  const kept=m.saved;
  const pctOf=v=>m.inc?v/m.inc*100:0;
  const cats=Object.entries(m.st.byCat).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const P=pace(3), LV=levers(3);

  return `
  <div class="hd"><h1>Money</h1></div>
  <div class="headline">
    <div class="hl">${kept>=0
      ?`You kept <b class="good">${m.rate.toFixed(0)}%</b> of what you earned in ${monLabel(k)} — <b>₹${money(kept)}</b> of ₹${money(m.inc)} not spent.`
      :`You spent <b class="bad">₹${money(-kept)} more</b> than you earned in ${monLabel(k)}.`}</div>
    <div class="hlsub">${avgRate!==null?`${avgRate.toFixed(0)}% average across ${withRate.length} month${withRate.length===1?'':'s'}`:'first month with income set'}${m.transfers?` · ₹${money(m.transfers)} moved to savings`:''}</div>
  </div>

  <div class="mbar"><div class="scrollx">
    ${months.slice(0,14).map(x=>`<button class="chip sm ${x===S.insMonth?'on':''}" data-imon="${x}">${monLabel(x)}</button>`).join('')}
    <button class="chip sm" id="incBtn">Edit income</button>
  </div></div>

  ${m.st.isCur?`<div class="sec">
    <div class="statbig">
      <div class="v num">₹${money(m.safe)}</div>
      <div class="d dimc">free to spend over the remaining ${m.daysLeft} day${m.daysLeft===1?'':'s'}${m.stillDue?` · ₹${money(m.stillDue)} of commitments still to land`:''}</div>
    </div>
    ${m.perDayLeft!==null?`<div class="hint" style="padding:0 18px">That is <b>₹${money(m.perDayLeft)} a day</b> if you spread it evenly. Income already committed to recurring payments is set aside first, so this is what is genuinely uncommitted.</div>`:''}
  </div>`:''}

  <div class="sec">
    <span class="lbl">Where ${monLabel(k)}'s income went</span>
    <div class="card pad14">
      <div class="split">
        <div class="splitbar">
          <div style="width:${Math.max(0,pctOf(m.fv.fixed)).toFixed(1)}%;background:#858C9A"></div>
          <div style="width:${Math.max(0,pctOf(m.fv.variable)).toFixed(1)}%;background:var(--hot)"></div>
          ${m.transfers?`<div style="width:${Math.max(0,pctOf(m.transfers)).toFixed(1)}%;background:#8A7BF0"></div>`:''}
          <div style="width:${Math.max(0,pctOf(Math.max(0,m.left))).toFixed(1)}%;background:#6ECFA6"></div>
        </div>
        <div class="splitrow"><span><i class="dot" style="background:#858C9A"></i>Committed</span>
          <span class="num">₹${money(m.fv.fixed)} · ${pctOf(m.fv.fixed).toFixed(0)}%</span></div>
        <div class="splitrow"><span><i class="dot" style="background:var(--hot)"></i>Variable</span>
          <span class="num">₹${money(m.fv.variable)} · ${pctOf(m.fv.variable).toFixed(0)}%</span></div>
        ${m.transfers?`<div class="splitrow"><span><i class="dot" style="background:#8A7BF0"></i>Saved / moved</span>
          <span class="num">₹${money(m.transfers)} · ${pctOf(m.transfers).toFixed(0)}%</span></div>`:''}
        <div class="splitrow"><span><i class="dot" style="background:#6ECFA6"></i>Left in account</span>
          <span class="num ${m.left<0?'bad':''}">₹${money(m.left)} · ${pctOf(m.left).toFixed(0)}%</span></div>
      </div>
    </div>
    <div class="hint" style="padding:0 18px">Commitments take <b>${m.committedPct.toFixed(0)}%</b> of your income before any decision is made.${
      m.transfers?'':' Money you move into savings would appear separately here once you mark that category as a transfer in More → Manage categories.'}</div>
  </div>

  ${P?`<div class="sec">
    <span class="lbl">At this pace</span>
    ${secNote(`Based on the median of your last ${P.months} complete month${P.months===1?'':'s'} — the current month is partial, so it is left out.`)}
    <div class="statbig">
      <div class="v num ${P.perYear<0?'bad':'good'}">${P.perYear<0?'−':''}₹${money(Math.abs(P.perYear))}</div>
      <div class="d dimc">${P.perYear>=0?'saved over a year':'short over a year'} · ₹${money(Math.abs(P.perMonth))} a month
        on ₹${money(P.medSpend)} typical spending</div>
    </div>
    <div class="card pad14" style="margin-top:10px">${fanSVG(P.perMonth,P.perYear/12>0?P.worstYear/12:P.bestYear/12,P.perYear/12>0?P.bestYear/12:P.worstYear/12)}
      <div class="legend"><span>Accumulating at this pace · shaded band is your best and worst recent month</span></div></div>
    <div class="hint" style="padding:0 18px">
      Depending on which recent month turns out typical, a year lands between
      <b>₹${money(Math.min(P.bestYear,P.worstYear))}</b> and <b>₹${money(Math.max(P.bestYear,P.worstYear))}</b>.
      ${P.thin?`<b class="hot">Only ${P.months} complete month${P.months===1?'':'s'} of data</b> — treat this as a rough shape, not a figure. It firms up as months accumulate.`:''}
      Plain accumulation; any interest or returns on what you invest are on top of this.
    </div>
    ${P.perYear>0&&P.coverMonths>0?`<div class="kpis" style="margin-top:10px">
      <div class="kpi"><span class="lbl">A year buys you</span><div class="v">${P.coverMonths.toFixed(1)} mo</div>
        <div class="d dimc">of living costs at ₹${money(P.medSpend)}/month</div></div>
      <div class="kpi"><span class="lbl">Typical spend</span><div class="v">₹${money(P.medSpend)}</div>
        <div class="d dimc">range ₹${money(P.loSpend)}–${money(P.hiSpend)}</div></div>
    </div>`:''}
  </div>`:''}

  ${LV.length?`<div class="sec">
    <span class="lbl">What a 10% trim is worth</span>
    ${secNote('Annual effect of spending a tenth less in each, at your recent pace. Recurring commitments are excluded — those are cancelled, not trimmed.')}
    <div class="card" style="padding:4px 14px">
    ${LV.map(l=>`<div class="duerow">
      <i class="dot" style="background:${l.color}"></i>
      <div style="min-width:0;flex:1"><div class="t">${esc(l.name)}</div>
        <div class="s">₹${money(l.perMonth)} a month now</div></div>
      <span class="num good" style="font-weight:600;flex:none">+₹${money(l.yearly)}<span class="dimc" style="font-size:10px">/yr</span></span></div>`).join('')}
    </div>
    <div class="hint" style="padding:0 18px">Trimming all four adds <b>₹${money(LV.reduce((s,l)=>s+l.yearly,0))} a year</b>${P&&P.perYear>0?`, taking the projection to ₹${money(P.perYear+LV.reduce((s,l)=>s+l.yearly,0))}`:''}.</div>
  </div>`:''}

  <div class="sec">
    <span class="lbl">Savings rate, last 12 months</span>
    ${secNote('Share of income not spent. Grey stubs are months with no income figure recorded.')}
    <div class="card pad14">${rateBar(hist)}</div>
  </div>

  ${cats.length?`<div class="sec">
    <span class="lbl">Categories as a share of income</span>
    ${secNote('Not share of spending — share of what you earned. A category at 4% of spending may be 1% of income, and that is the number that matters.')}
    <div class="card pad14">
    ${cats.map(([id,v])=>`<div class="bar">
      <div class="top"><span style="display:flex;align-items:center;gap:8px;min-width:0">
        <i class="dot" style="background:${CATMAP[id].color}"></i>
        <b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(CATMAP[id].name)}</b></span>
        <span class="num" style="flex:none">${pctOf(v).toFixed(1)}% <span class="dimc" style="font-size:11px">₹${money(v)}</span></span></div>
      <div class="track"><div class="fill" style="width:${Math.min(100,pctOf(v)/Math.max(1,pctOf(cats[0][1]))*100).toFixed(1)}%;background:${CATMAP[id].color}"></div></div>
    </div>`).join('')}
    </div></div>`:''}
  <div style="height:16px"></div>`;
}

/* ══════════════════ 7. SHEETS ══════════════════ */
function openSheet(html){
  const v=document.createElement('div');v.className='veil';
  v.innerHTML=`<div class="sheet"><div class="grab"></div>${html}</div>`;
  v.addEventListener('click',e=>{if(e.target===v)v.remove();});
  document.body.appendChild(v);return v;
}
function closeSheet(){const v=$('.veil');if(v)v.remove();}

const activeCats=()=>CATS.filter(c=>!c.is_archived);
const catUsage=id=>live().filter(e=>e.category_id===id).length;

function catSheet(current,onPick){
  const list=activeCats();
  // an archived category still shows while it is the current pick, so editing an
  // old entry never silently reassigns it
  if(current&&CATMAP[current]&&CATMAP[current].is_archived)list.unshift(CATMAP[current]);
  const v=openSheet(`<h3>Category</h3><div class="catgrid">
    ${list.map(c=>`<button class="catbtn ${c.id===current?'on':''}" data-c="${c.id}">
      <i class="dot" style="background:${c.color}"></i>${esc(c.name)}${c.is_archived?' <span class="tag">HIDDEN</span>':''}</button>`).join('')}
  </div><div style="height:14px"></div>`);
  v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{buzz();closeSheet();onPick(b.dataset.c);});
}

function editSheet(id,override){
  const e=EXP.find(x=>x.id===id);if(!e)return;
  const st=override||{amount:String(e.amount),desc:e.description||'',date:e.spent_on,cat:e.category_id};
  const v=openSheet(`<h3>Edit entry</h3>
    <div class="pad">
      <div class="frow"><span class="lbl">Amount</span>
        <input id="eAmt" type="number" inputmode="decimal" step="0.01" min="0.01" value="${esc(st.amount)}"></div>
      <div class="frow"><span class="lbl">What</span><input id="eDesc" value="${esc(st.desc)}" maxlength="90"></div>
      <div class="frow"><span class="lbl">Date</span><input id="eDate" type="date" value="${st.date}" max="${today()}"></div>
      <div class="gu"><button class="chip on" id="eCat">
        <i class="dot" style="background:${CATMAP[st.cat].color}"></i>${esc(CATMAP[st.cat].name)}</button></div>
      <div style="font-size:11px;color:var(--dim);margin-top:12px" class="num">
        created ${localTs(e.created_at)}${e.updated_at!==e.created_at?' · edited '+localTs(e.updated_at):''}</div>
    </div>
    <div class="act"><button class="prim" id="eSave">Save changes</button></div>
    <div class="act" style="margin-top:22px"><button class="del" id="eDel">Delete this entry</button></div>`);
  const grab=()=>({amount:$('#eAmt',v).value,desc:$('#eDesc',v).value,date:$('#eDate',v).value||st.date,cat:st.cat});
  $('#eCat',v).onclick=()=>{const current=grab();closeSheet();   // was named `live`, shadowing live()
    catSheet(st.cat,c=>editSheet(id,{...current,cat:c}));};
  $('#eDel',v).onclick=async()=>{
    if(READONLY)return toast('Read-only — this is a backup view');
    const keep={deleted_at:e.deleted_at,updated_at:e.updated_at};
    e.deleted_at=now();e.updated_at=now();               // soft delete — survives a future sync
    try{ await DB.put('expenses',e); }
    catch(err){ Object.assign(e,keep); console.error(err); return toast('Could not delete'); }
    await reload();closeSheet();buzz(14);
    toastUndo('Deleted ₹'+money(e.amount),async()=>{
      e.deleted_at=null;e.updated_at=now();
      try{ await DB.put('expenses',e); await reload(); toast('Restored'); }
      catch(err){ console.error(err); toast('Could not restore'); }
    });
  };
  $('#eSave',v).onclick=async()=>{
    if(READONLY)return toast('Read-only — this is a backup view');
    const f=grab(),a=parseFloat(f.amount);
    if(!(a>0))return toast('Amount must be greater than 0');
    const keep={amount:e.amount,description:e.description,spent_on:e.spent_on,
                category_id:e.category_id,updated_at:e.updated_at};
    Object.assign(e,{amount:Math.round(a*100)/100,description:f.desc.trim(),
      spent_on:f.date,category_id:f.cat,updated_at:now()});
    try{ await DB.put('expenses',e); }
    catch(err){ Object.assign(e,keep); console.error(err); return toast('Could not save changes'); }
    try{ await learn(e.description,e.category_id); }catch(err){ console.warn(err); }
    await reload();closeSheet();toast('Updated');
  };
}

const PALETTE=['#C4703C','#7FD1AE','#F5B942','#6FA8DC','#C58AF9','#E5484D','#5EC7C7',
  '#F58CA8','#9BE07A','#8A7BF0','#4FD1C5','#FF9EC4','#B0A0FF','#FFCB6B','#FF8A5B','#A0AEC0'];

function catManageSheet(){
  const act=activeCats(), arch=CATS.filter(c=>c.is_archived);
  const row=c=>`<button class="mrow" data-edit-cat="${c.id}">
    <i class="dot" style="background:${c.color}"></i>
    <span class="mname">${esc(c.name)}${c.is_transfer?' <span class="tag">TRANSFER</span>':''}</span>
    <span class="dimc" style="font-size:11.5px;flex:none">${catUsage(c.id)} used</span></button>`;
  const v=openSheet(`<h3>Categories</h3>
    <div class="pad" style="padding-bottom:6px">${act.map(row).join('')}</div>
    ${arch.length?`<div class="lbl pad" style="margin:14px 0 6px">Hidden</div>
      <div class="pad" style="opacity:.55">${arch.map(row).join('')}</div>`:''}
    <div class="act"><button class="prim" id="catNew">New category</button></div>`);
  v.querySelectorAll('[data-edit-cat]').forEach(b=>b.onclick=()=>{closeSheet();catEditSheet(b.dataset.editCat);});
  $('#catNew',v).onclick=()=>{closeSheet();catEditSheet(null);};
}

function catEditSheet(id){
  const c=id?CATMAP[id]:null;
  const used=id?catUsage(id):0;
  let color=c?c.color:PALETTE[CATS.length%PALETTE.length];
  let transfer=!!(c&&c.is_transfer);
  const v=openSheet(`<h3>${c?'Edit category':'New category'}</h3>
    <div class="pad">
      <label class="lbl" for="cName">Name</label>
      <input id="cName" class="quickin" maxlength="28" value="${c?esc(c.name):''}" placeholder="e.g. Site visits">
      <div class="lbl" style="margin:16px 0 8px">Colour</div>
      <div class="swatches">${PALETTE.map(p=>`<button class="sw ${p===color?'on':''}" data-sw="${p}"
        style="background:${p}" aria-label="colour ${p}"></button>`).join('')}</div>
      <div style="height:18px"></div>
      <button class="mrow" id="cTrans" style="margin:0"><i class="dot" style="background:${transfer?'#8A7BF0':'#3A404C'}"></i>
        <span class="mname">Transfer, not spending</span>
        <span class="chip sm ${transfer?'on':''}" style="pointer-events:none;flex:none">${transfer?'On':'Off'}</span></button>
      <div class="hint">For money moved rather than spent — an RD deposit, a transfer to savings. Entries in a transfer category stay in your Log but are kept out of every spending total, so they cannot understate your savings rate.</div>
      ${c?`<div class="hint" style="margin-top:16px">${used
        ?`Used by <b>${used}</b> ${used===1?'entry':'entries'}. Hiding keeps every one of them intact — it only removes this from the picker for new expenses.`
        :'Not used by any entry yet, so it can be deleted outright.'}</div>`:''}
    </div>
    <div class="act"><button class="prim" id="cSave">${c?'Save':'Create'}</button></div>
    ${c?`<div class="act" style="margin-top:20px">
      <button id="cArch">${c.is_archived?'Unhide':'Hide from picker'}</button>
      ${used?'':'<button class="del" id="cDel">Delete</button>'}</div>`:''}`);

  $('#cTrans',v).onclick=()=>{
    transfer=!transfer;
    const dot=$('#cTrans .dot',v),chip=$('#cTrans .chip',v);
    dot.style.background=transfer?'#8A7BF0':'#3A404C';
    chip.className='chip sm'+(transfer?' on':'');chip.textContent=transfer?'On':'Off';
  };
  v.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{
    color=b.dataset.sw;
    v.querySelectorAll('[data-sw]').forEach(x=>x.classList.toggle('on',x.dataset.sw===color));
  });

  const persist=async(rows,msg)=>{
    if(READONLY)return toast('Read-only — this is a backup view');
    try{ await DB.put('categories',rows); }
    catch(err){ console.error(err); return toast('Could not save category'); }
    CATS=await DB.all('categories');DATA_VER++;
    CATS.sort((a,b)=>a.sort-b.sort);CATMAP=Object.fromEntries(CATS.map(x=>[x.id,x]));
    closeSheet();render();toast(msg);
  };

  $('#cSave',v).onclick=async()=>{
    const name=$('#cName',v).value.trim();
    if(!name)return toast('Give it a name');
    if(CATS.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase()))
      return toast('You already have a category called that');
    if(c)await persist({...c,name,color,is_transfer:transfer?1:0},'Category updated');
    else await persist({id:'c'+Date.now().toString(36),name,color,is_transfer:transfer?1:0,
      sort:Math.max(0,...CATS.map(x=>x.sort||0))+1,is_archived:0},'Category added');
  };
  const ar=$('#cArch',v);
  if(ar)ar.onclick=async()=>{
    if(!c.is_archived&&activeCats().length<=1)return toast('Keep at least one category');
    await persist({...c,is_archived:c.is_archived?0:1},c.is_archived?'Unhidden':'Hidden from picker');
  };
  const dl=$('#cDel',v);
  if(dl)dl.onclick=async()=>{
    if(catUsage(c.id))return toast('In use — hide it instead');   // never orphan an expense
    try{ await DB.del('categories',c.id); }
    catch(err){ console.error(err); return toast('Could not delete'); }
    CATS=(await DB.all('categories')).sort((a,b)=>a.sort-b.sort);DATA_VER++;
    CATMAP=Object.fromEntries(CATS.map(x=>[x.id,x]));
    closeSheet();render();toast('Deleted');
  };
}

function dateSheet(){
  const v=openSheet(`<h3>Date of expense</h3>

  $('#dPick',v).onchange=e=>{if(e.target.value){S.date=e.target.value;S.dateManual=true;closeSheet();render();}};
}

/* ══════════════════ 8. ACTIONS ══════════════════ */
/* Re-entrancy guard against a double-tap minting two rows.
   Sound because the check and the set below are separated by no await —
   JavaScript cannot interleave another invocation into synchronous code — and
   the flag is released in a finally so no throw can wedge it permanently.
   Verified by firing three concurrent calls and asserting one row is written.
   Static analysers flag this shape as a race; it is not one here. */
let saving=false;
async function saveExpense(){
  if(READONLY)return toast('Read-only — this is a backup view');
  if(saving)return;                            // ─┐ no await between these two
  const a=addState();                          //  │ lines, so the guard holds
  if(!(a.amount>0))return;                     //  │
  saving=true;                                 // ─┘
  const btn=$('#save');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const cat=a.cat||'misc';
  const t=now();
  const row={
    id:uid(), amount:Math.round(a.amount*100)/100, spent_on:a.date, category_id:cat,
    description:a.desc, created_at:t, updated_at:t, deleted_at:null, schema:SCHEMA_VERSION
  };
  try{
    await DB.put('expenses',row);
  }catch(err){
    // A write can fail on quota or a transaction abort. Say so and keep what
    // was typed — silently dropping the entry is the worst possible outcome.
    console.error('save failed',err);
    saving=false;
    if(btn){btn.disabled=false;btn.textContent=saveLabel();}
    toast('Could not save — nothing was recorded');
    return;
  }
  try{ if(S.catManual)await learn(row.description,cat); }   // confirmed choices only
  catch(err){ console.warn('categoriser learn failed',err); }  // never lose the expense over this
  finally{ saving=false; }                                   // released on every path
  EXP.unshift(row);DATA_VER++;
  buzz(14);toast('₹'+money2(row.amount)+' · '+CATMAP[cat].name);
  S.quick='';S.amount='';S.desc='';S.cat=null;S.catManual=false;S.dateManual=false;S.date=today();
  render();
  const f=$('#quick');if(f)f.focus();          // stay in flow for the next entry
}

function toCSV(){
  const head=['id','date','amount','category','description','created_at','updated_at'];
  const esc2=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=live().slice().sort((a,b)=>a.spent_on<b.spent_on?-1:1)
    .map(e=>[e.id,e.spent_on,e.amount,CATMAP[e.category_id].name,e.description,e.created_at,e.updated_at].map(esc2).join(','));
  return head.join(',')+'\n'+rows.join('\n');
}
function download(name,text,type){
  const b=new Blob([text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
async function markExport(){
  try{ await DB.put('meta',{k:'last_export',v:today()});S.backupNudge=0; }
  catch(e){ console.warn('could not record export date',e); }
}
function backupJSON(){
  return JSON.stringify({app:'ledger',schema:SCHEMA_VERSION,exported_at:now(),
    expenses:EXP,categories:CATS,rules:[...RULES.values()]},null,1);
}
/* A download lands in phone storage, which dies with the phone — so it isn't
   really a backup. The share sheet puts the file straight into Drive, Gmail or
   WhatsApp, off the device. navigator.share must run inside the tap, so the
   File is built synchronously before any await. */
async function shareBackup(){
  const name='ledger-backup-'+today()+'.json';
  let file=null;
  try{ file=new File([backupJSON()],name,{type:'application/json'}); }catch{}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:'Ledger backup'});
      await markExport();toast('Backup sent');return;
    }catch(err){
      if(err&&err.name==='AbortError')return;         // user dismissed the sheet
      console.warn('share failed, falling back',err);
    }
  }
  download(name,backupJSON(),'application/json');
  await markExport();toast('Saved to your downloads');
}

/* FUTURE — merge is last-write-wins on updated_at, which silently discards the
   loser when the same entry was edited on two devices. Fine today because only
   one device writes. Real two-way sync needs per-field versioning or a CRDT,
   and that is a prerequisite for the Postgres replica, not an afterthought. */
async function doImport(file){
  if(READONLY)return toast('Read-only — reload to leave the backup view');
  try{
    const j=JSON.parse(await file.text());
    if(!j.expenses||!Array.isArray(j.expenses))throw new Error('not a Ledger backup');
    const byId=new Map(EXP.map(e=>[e.id,e]));
    const merged=[];
    for(const r of j.expenses){
      if(!r.id||!(r.amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(r.spent_on))continue;
      if(!CATMAP[r.category_id])r.category_id='misc';
      const ex=byId.get(r.id);
      if(!ex||(r.updated_at||'')>(ex.updated_at||''))merged.push(r);
    }
    if(merged.length)await DB.put('expenses',merged);   // single transaction: all or nothing
    if(j.rules&&Array.isArray(j.rules)&&j.rules.length)await DB.put('rules',j.rules);
    await reload();
    toast(merged.length+' entries merged');
  }catch(e){toast('Import failed: '+e.message);}
}

async function openViewer(file){
  try{
    const j=JSON.parse(await file.text());
    if(!j.expenses||!Array.isArray(j.expenses))throw new Error('not a Ledger backup');
    if(Array.isArray(j.categories)&&j.categories.length){
      CATS=j.categories.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
      CATMAP=Object.assign(Object.create(null),Object.fromEntries(CATS.map(c=>[c.id,c])));
    }
    EXP=j.expenses.filter(e=>e&&e.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(e.spent_on))
      .map(e=>CATMAP[e.category_id]?e:{...e,category_id:'misc'})
      .sort((a,b)=>a.spent_on<b.spent_on?1:a.spent_on>b.spent_on?-1:0);
    RULES=new Map((j.rules||[]).map(r=>[r.token,r]));
    READONLY=true;DATA_VER++;S.view='ins';S.tsec='over';
    closeSheet();render();window.scrollTo(0,0);
    toast(EXP.length+' entries loaded, read-only');
  }catch(err){ console.error(err); toast('Could not read that file: '+err.message); }
}

/* ══════════════════ 9. BOOT + RENDER ══════════════════ */
async function reload(){
  DATA_VER++;
  if(READONLY){render();return;}            // viewer data is in memory, not IndexedDB
  const [ex,ru]=await Promise.all([DB.all('expenses'),DB.all('rules')]);
  EXP=ex.sort((a,b)=>a.spent_on<b.spent_on?1:a.spent_on>b.spent_on?-1:(b.created_at>a.created_at?1:-1));
  RULES=new Map(ru.map(r=>[r.token,r]));
  render();
}

const NAVS=[
  ['add','Add','M12 5v14M5 12h14'],
  ['log','Log','M4 6h16M4 12h16M4 18h11'],
  ['ins','Trends','M4 19V5M4 19h16M8 15l3-5 3 3 4-7'],
  ['money','Money','M12 2v20M17 6.5c0-1.9-2.2-3-5-3s-5 1.1-5 3 2.2 2.7 5 3.2 5 1.3 5 3.3-2.2 3-5 3-5-1.1-5-3'],
  ['more','More','M5 12h.01M12 12h.01M19 12h.01']
];
/* Crosshair scrub. Reads a value at any point without hover, which phones do
   not have. Pointer events cover touch and mouse, so this works on the laptop
   viewer too. */
function bindScrub(){
  const wrap=$('#heroChart');
  if(!wrap||!HERO||!HERO.xy||HERO.xy.length<2)return;
  const read=$('#heroRead'),svg=wrap.querySelector('svg');
  if(!svg)return;
  const n=HERO.xy.length;
  let active=false;
  const at=cx=>{
    const r=svg.getBoundingClientRect();
    if(!r.width)return 0;
    return Math.max(0,Math.min(n-1,Math.round((cx-r.left)/r.width*(n-1))));
  };
  const show=i=>{
    const p=HERO.xy[i],g=document.getElementById('xh'),
          ln=document.getElementById('xhLine'),dt=document.getElementById('xhDot');
    if(!g)return;
    g.setAttribute('opacity','1');
    ln.setAttribute('x1',p.x);ln.setAttribute('x2',p.x);
    dt.setAttribute('cx',p.x);dt.setAttribute('cy',p.y);
    read.innerHTML=heroReadout(i);
  };
  const hide=()=>{
    const g=document.getElementById('xh');if(g)g.setAttribute('opacity','0');
    read.innerHTML=heroReadout(null);active=false;
  };
  wrap.onpointerdown=e=>{active=true;wrap.setPointerCapture&&wrap.setPointerCapture(e.pointerId);
    buzz(5);show(at(e.clientX));};
  wrap.onpointermove=e=>{if(active){e.preventDefault();show(at(e.clientX));}};
  const release=e=>{
    try{ if(e&&wrap.releasePointerCapture&&wrap.hasPointerCapture&&wrap.hasPointerCapture(e.pointerId))
      wrap.releasePointerCapture(e.pointerId); }catch{}
    hide();
  };
  wrap.onpointerup=wrap.onpointercancel=wrap.onpointerleave=release;
}

/* Horizontal swipe to step through months — a date dropdown is a poor fit for
   a thumb, and stepping periods is the single most common action on these screens. */
function swipeMonths(){
  const el=$('#app');let x0=null,y0=null;
  el.classList.add('swipe');
  el.ontouchstart=e=>{
    // the chart owns horizontal drags inside itself — never block its gesture
    if(e.target.closest&&e.target.closest('#heroWrap')){x0=null;return;}
    if(e.touches.length!==1)return;
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;
  };
  el.ontouchend=e=>{
    if(x0===null)return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    x0=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.6)return;   // ignore vertical scrolls
    if(S.view==='ins'){                       // swipe between views, like tabbed pagers
      const i=TSECT.findIndex(t=>t[0]===S.tsec), j=i+(dx<0?1:-1);
      if(j<0||j>=TSECT.length)return;
      S.tsec=TSECT[j][0];buzz();render();window.scrollTo(0,0);return;
    }
    const months=[...new Set(live().map(x=>monKey(x.spent_on)))].sort().reverse();
    const i=months.indexOf(S.logMonth), j=i+(dx<0?1:-1);          // swipe left = older
    if(j<0||j>=months.length)return;
    S.logMonth=months[j];buzz();render();window.scrollTo(0,0);
  };
}

function render(){
  const app=$('#app');
  app.ontouchstart=app.ontouchend=null;app.classList.remove('swipe');   // reset per-view gestures
  if(READONLY&&S.view==='add')S.view='ins';
  const banner=READONLY?`<div class="banner" role="status" style="margin:12px 18px 0;display:flex;
    align-items:center;gap:12px"><span style="flex:1">Viewing a backup file. Nothing here is saved.</span>
    <button id="exitView" style="flex:none;padding:0 13px;min-height:34px;border-radius:8px;
      background:var(--hot);color:#140A05;font-weight:700;font-size:12.5px">Exit</button></div>`:'';
  app.innerHTML=banner+{add:vAdd,log:vLog,ins:vInsights,money:vMoney,more:vMore}[S.view]();
  const navs=READONLY?NAVS.filter(n=>n[0]!=='add'):NAVS;
  $('#nav').style.gridTemplateColumns='repeat('+navs.length+',1fr)';
  $('#nav').innerHTML=navs.map(([k,l,d])=>`<button data-v="${k}" class="${S.view===k?'on':''}"
    aria-label="${l}" aria-current="${S.view===k?'page':'false'}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg><span>${l}</span></button>`).join('');
  bind();
  const ex=$('#exitView');if(ex)ex.onclick=()=>location.reload();
}
function bind(){
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
    if(S.view!==b.dataset.v){S.view=b.dataset.v;buzz();window.scrollTo(0,0);render();}});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSheet(b.dataset.edit));

  if(S.view==='add'){
    const refresh=()=>{                    // patch preview + save only; never re-render the focused input
      $('#preview').innerHTML=previewHTML();
      const s=$('#save');s.disabled=!(addState().amount>0);s.textContent=saveLabel();
      const w=$('#warn');if(w)w.innerHTML=warnHTML();
      bindPreview();
    };
    const bindPreview=()=>{
      $('#catbtn').onclick=()=>{const a=addState();
        catSheet(a.cat,c=>{S.cat=c;S.catManual=true;refresh();});};
      $('#datebtn').onclick=dateSheet;
    };
    bindPreview();
    document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{
      if(S.mode===b.dataset.mode)return;
      const a=addState();                   // carry work across the mode switch
      S.mode=b.dataset.mode;
      if(S.mode==='pad'){S.amount=a.amount?String(a.amount):'';S.desc=a.desc;}
      else S.quick=[a.amount||'',a.desc].filter(Boolean).join(' ').trim();
      buzz();render();
    });
    document.querySelectorAll('[data-fq]').forEach(b=>b.onclick=()=>{
      const f=frequents()[+b.dataset.fq];if(!f)return;
      S.mode==='quick'?S.quick=f.label+' '+f.amt:(S.amount=String(f.amt),S.desc=f.label);
      S.cat=f.cat;S.catManual=true;buzz();render();
    });
    const q=$('#quick');
    if(q){q.oninput=()=>{S.quick=q.value;refresh();};
      q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();if(addState().amount>0)saveExpense();}};}
    const d=$('#desc');
    if(d){d.oninput=()=>{S.desc=d.value;refresh();};
      d.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();d.blur();}};}
    document.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
      const k=b.dataset.k;buzz(6);
      if(k==='del')S.amount=S.amount.slice(0,-1);
      else if(k==='.'){if(!S.amount.includes('.'))S.amount=(S.amount||'0')+'.';}
      else{
        const dec=S.amount.split('.')[1];
        if(dec&&dec.length>=2)return;
        if(S.amount.replace('.','').length>=9)return;
        S.amount=(S.amount==='0'?'':S.amount)+k;
      }
      refresh();
    });
    $('#save').onclick=saveExpense;
  }
  if(S.view==='log'){
    document.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{S.logMonth=b.dataset.mon;render();});
    const q=$('#q');
    if(q)q.oninput=()=>{               // patch only the list; never blow away the focused input
      S.q=q.value;
      const box=$('#loglist');box.innerHTML=logList();
      box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editSheet(b.dataset.edit));
    };
  }
  if(S.view==='ins'){
    if(S.tsec==='over')bindScrub();
    document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{
      if(S.range===b.dataset.range)return;S.range=b.dataset.range;buzz();render();});
    document.querySelectorAll('[data-metric]').forEach(b=>b.onclick=()=>{
      if(S.metric===b.dataset.metric)return;S.metric=b.dataset.metric;buzz();render();});
    document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.tog;
      if(k==='smooth'&&S.metric==='cum')return toast('A running total is already smooth');
      S[k]=!S[k];buzz();render();});
    document.querySelectorAll('[data-imon]').forEach(b=>b.onclick=()=>{S.insMonth=b.dataset.imon;render();});
    document.querySelectorAll('[data-mbar]').forEach(r=>r.onclick=()=>{
      const k=last12()[+r.dataset.mbar].key;
      if(live().some(e=>monKey(e.spent_on)===k)){S.insMonth=k;buzz();render();}
      else toast('Nothing recorded in '+monLabel(k));
    });
    document.querySelectorAll('[data-day]').forEach(r=>r.onclick=()=>{
      const d=r.dataset.day;
      S.date=d;S.dateManual=true;S.view='add';S.mode='quick';
      buzz();render();window.scrollTo(0,0);
      const q=$('#quick');if(q)q.focus();
      toast('Adding for '+dayLabel(d));
    });
    document.querySelectorAll('[data-tsec]').forEach(b=>b.onclick=()=>{
      if(S.tsec===b.dataset.tsec)return;
      S.tsec=b.dataset.tsec;buzz();render();window.scrollTo(0,0);});
  }
  document.querySelectorAll('[data-hz]').forEach(b=>b.onclick=()=>{S.horizon=+b.dataset.hz;buzz();render();});
  document.querySelectorAll('[data-ann]').forEach(b=>b.onclick=()=>{S.rannual=b.dataset.ann==='1';buzz();render();});
  if(S.view==='money'){
    const ib=$('#incBtn');if(ib)ib.onclick=incomeSheet;
    document.querySelectorAll('[data-imon]').forEach(b=>b.onclick=()=>{S.insMonth=b.dataset.imon;render();});
  }
  if(S.view==='ins'||S.view==='log')swipeMonths();
  if(S.view==='more'){
    $('#shareBk').onclick=shareBackup;
    $('#catMgr').onclick=catManageSheet;
    $('#expJson').onclick=async()=>{
      download('ledger-backup-'+today()+'.json',backupJSON(),'application/json');
      await markExport();toast('Backup downloaded');
    };
    $('#expCsv').onclick=async()=>{download('expenses-'+today()+'.csv',toCSV(),'text/csv');await markExport();};
    $('#viewBtn').onclick=()=>$('#viewFile').click();
    $('#viewFile').onchange=e=>{if(e.target.files[0])openViewer(e.target.files[0]);};
    $('#impBtn').onclick=()=>$('#impBtn')&&$('#impFile').click();
    $('#impFile').onchange=e=>{if(e.target.files[0])doImport(e.target.files[0]);};
    $('#persistBtn').onclick=async()=>{S.persisted=await requestPersist();
      toast(S.persisted?'Persistent storage granted':'Denied — install to home screen first');render();};
    $('#clrRules').onclick=async()=>{
      if(!confirm('Forget all learned word→category mappings? Seed keywords stay.'))return;
      for(const t of RULES.keys())await DB.del('rules',t);
      RULES.clear();render();toast('Categoriser reset');
    };
    const sw=$('#swState');
    if(sw){
      if(!('serviceWorker'in navigator))sw.textContent='Service workers unsupported here — needs HTTPS.';
      else navigator.serviceWorker.getRegistration().then(r=>{
        sw.textContent=r&&r.active
          ?'Ready. App shell, fonts and icons are cached — opens and records with no network.'
          :'Not registered yet. Open once over HTTPS, then relaunch.';
      }).catch(()=>{sw.textContent='Unknown';});
    }
    if(navigator.storage&&navigator.storage.estimate){
      navigator.storage.estimate().then(e=>{const u=$('#usage');
        if(u)u.textContent=((e.usage||0)/1024).toFixed(0)+' KB used of '+((e.quota||0)/1048576/1024).toFixed(1)+' GB available';});
    }
  }
}

/* Launch intents.
   ?go=add|log|ins|rec|more  — home-screen shortcuts (long-press the app icon).
   ?text=… / ?title=…        — Android share sheet: share any text into Ledger
                               and it lands in the parser pre-filled.
   Android widgets are not available to web apps at all (and even native ones
   cannot host a real text field), so a shortcut into a focused input is the
   shortest path that exists on this platform. */
function readLaunchParams(){
  let P;
  try{P=new URLSearchParams(location.search);}catch{return;}
  if(![...P.keys()].length)return;
  const shared=[P.get('title'),P.get('text'),P.get('url')].filter(Boolean).join(' ').trim();
  if(shared){S.view='add';S.mode='quick';S.quick=shared.slice(0,120);S.focusQuick=true;}
  const go=P.get('go');
  if(go&&['add','log','ins','money','more'].includes(go)){
    S.view=go;
    if(go==='add')S.focusQuick=true;
  }
  // strip the query so a reload or relaunch doesn't replay the same intent
  try{history.replaceState({},'',location.pathname);}catch{}
}

(async function boot(){
  const real=await DB.open();
  let cats=await DB.all('categories');
  if(!cats.length){
    cats=SEED_CATS.map(([id,name,color],i)=>({id,name,color,sort:i,is_archived:0}));
    await DB.put('categories',cats);
    await DB.put('meta',{k:'schema_version',v:SCHEMA_VERSION});
  }
  CATS=cats.sort((a,b)=>a.sort-b.sort);CATMAP=Object.assign(Object.create(null),Object.fromEntries(CATS.map(c=>[c.id,c])));
  S.persisted=real?await requestPersist():null;
  try{const ic=await DB.get('meta','income');
    if(ic&&ic.v)INCOME={monthly:0,period:'month',overrides:{},...JSON.parse(ic.v)};
  }catch(e){console.warn('income load failed',e);}
  const le=await DB.get('meta','last_export');
  const first=(await DB.all('expenses')).length;
  S.backupNudge=(first>15&&(!le||daysBetween(le.v,today())>14))?(le?daysBetween(le.v,today()):999):0;
  if(S.backupNudge===999)S.backupNudge='many';
  readLaunchParams();
  await reload();
  if(S.focusQuick){
    const q=$('#quick');
    if(q){q.focus();try{q.setSelectionRange(q.value.length,q.value.length);}catch{}}
    S.focusQuick=false;
  }
  if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
