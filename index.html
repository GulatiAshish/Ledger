  const R=detectRecurring().filter(r=>r.confidence>=45);
  let stillDue=0;
  if(st.isCur){
    const endOfMonth=k+'-'+pad2(st.dim);
    for(const r of R){
      let d=r.next,g=0;
      if(r.manual&&r.overdue&&monKey(d)===k){stillDue+=r.expect;d=stepRec(r,d);}
      while(d<=endOfMonth&&g++<10){ if(d>=today())stillDue+=r.expect; d=stepRec(r,d); }
    }
  }
  const daysLeft=st.isCur?Math.max(0,st.dim-st.elapsed):0;
  return{inc,st,fv,transfers:tr,saved,left,stillDue,daysLeft,
    rate:inc?saved/inc*100:null,
    committedPct:inc?fv.fixed/inc*100:null,
    safe:st.isCur?Math.max(0,inc-st.total-tr-stillDue):null,
    perDayLeft:st.isCur&&daysLeft?Math.max(0,inc-st.total-tr-stillDue)/daysLeft:null};
}
/* Forward projection from recent pace.
   Rules that keep it honest:
   - complete months only. The current month is partial and would understate spend.
   - median, not mean. Spending is right-skewed; one heavy month should not set the forecast.
   - a range, not a point. The best and worst of the recent months bound it, because a
     single number implies a precision that three months of data does not support.
   - months with no entries at all are dropped rather than counted as zero spending. */
function pace(n=3){
  const d=new Date();d.setDate(1);
  const keys=[];
  for(let i=1;i<=n;i++){const t=new Date(d.getFullYear(),d.getMonth()-i,1);
    keys.push(t.getFullYear()+'-'+pad2(t.getMonth()+1));}
  const rows=keys.filter(fullMonth).map(k=>{       // a part-tracked month is not a typical month
    const rs=live().filter(e=>monKey(e.spent_on)===k);
    return{k,spend:sum(rs),n:rs.length,inc:incomeFor(k)};
  }).filter(r=>r.n>0);
  if(!rows.length)return null;
  const sp=rows.map(r=>r.spend).sort((a,b)=>a-b);
  const inc=rows.map(r=>r.inc).sort((a,b)=>a-b);
  const med=quantile(sp,.5), lo=sp[0], hi=sp[sp.length-1];
  const incMed=quantile(inc,.5)||INCOME.monthly||0;
  const perMonth=incMed-med;
  return{months:rows.length, rows, medSpend:med, loSpend:lo, hiSpend:hi, income:incMed,
    perMonth, perYear:perMonth*12,
    bestYear:(incMed-lo)*12, worstYear:(incMed-hi)*12,
    coverMonths:med?(perMonth*12)/med:0,
    thin:rows.length<3};
}

/* What trimming a category would be worth over a year. Recurring commitments are
   excluded — those are not trimmed by deciding, they are trimmed by cancelling,
   which the Committed view already covers. */
function levers(n=3,cut=0.10){
  const d=new Date();d.setDate(1);
  const keys=[];
  for(let i=1;i<=n;i++){const t=new Date(d.getFullYear(),d.getMonth()-i,1);
    keys.push(t.getFullYear()+'-'+pad2(t.getMonth()+1));}
  const sigs=new Set(detectRecurring().map(r=>r.sig));
  const tot=nullMap(),seen=new Set();
  const full=keys.filter(fullMonth);
  for(const e of live()){
    if(!full.includes(monKey(e.spent_on)))continue;
    if(isFixedCat(e.category_id))continue;
    seen.add(monKey(e.spent_on));
    if(sigs.has(signature(e)))continue;
    tot[e.category_id]=(tot[e.category_id]||0)+e.amount;
  }
  const months=Math.max(1,seen.size);
  return Object.entries(tot).map(([id,v])=>({id,name:CATMAP[id].name,color:CATMAP[id].color,
    perMonth:v/months, yearly:(v/months)*cut*12})).sort((a,b)=>b.yearly-a.yearly).slice(0,4);
}

function fanSVG(perMonth,lo,hi){
  const W=340,H=120,P=8,n=13;
  const pts=v=>Array.from({length:n},(_,i)=>v*i);
  const mid=pts(perMonth),a=pts(lo),b=pts(hi);
  const all=[...mid,...a,...b];
  const max=Math.max(1,...all),min=Math.min(0,...all);
  const X=i=>(i/(n-1))*W, Y=v=>P+(H-P*2)*(1-(v-min)/(max-min||1));
  const path=arr=>arr.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" style="display:block" role="img">`;
  const zero=Y(0);
  s+=`<path d="${path(b)} ${a.map((v,i)=>'L'+X(n-1-i).toFixed(1)+' '+Y(a[n-1-i]).toFixed(1)).join(' ')} Z"
      fill="${perMonth>=0?PAL.good:PAL.bad}" opacity=".13"/>`;
  s+=`<line class="grid" x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}" opacity=".8"/>`;
  s+=`<path d="${path(mid)}" fill="none" stroke="${perMonth>=0?PAL.good:PAL.bad}"
      stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=`<text class="axis" x="0" y="${H+14}">now</text>
      <text class="axis" x="${W}" y="${H+14}" text-anchor="end">12 months</text>`;
  return s+'</svg>';
}

function savingsHistory(n=12){
  const out=[],d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){
    const t=new Date(d.getFullYear(),d.getMonth()-i,1);
    const k=t.getFullYear()+'-'+pad2(t.getMonth()+1);
    const inc=incomeFor(k);
    const cur=k===monKey(today());
    if(!inc||(!cur&&!fullMonth(k))||(cur&&coverage(k)===0)){out.push({key:k,rate:null,inc,spent:0});continue;}
    const spent=sum(live().filter(e=>monKey(e.spent_on)===k));   // transfers are not spending
    out.push({key:k,inc,spent,rate:(inc-spent)/inc*100,partial:cur});
  }
  return out;
}

/* ══════════════════ 3a-ii. DAILY ALLOWANCE ══════════════════
   One number for today, recomputed every day from what is left of the month.

   The design is shaped by Pocheptsova Ghosh & Huang (Think Forward Initiative),
   who found across three field studies and two experiments that people who kept
   checking a precise remaining-budget figure spent MORE than their budget: with
   no exact number people keep a safety margin; given one, they spend up to it.
   The interventions that reduced this, and how each appears here:
     - rollover reminders   → unspent money visibly rolls into the rest of the month
     - a range, not a point → an on-track allowance AND a ceiling, shown together
     - shorter windows      → the window is one day
     - mid-period updates   → recomputed daily; income can be overridden per month
   And the one that backfired — splitting into several smaller budgets — is
   deliberately absent: there are no per-category budgets.

   Fixed costs (fixed categories and detected recurring payments) are set aside
   for the whole month up front, so a rent payment never lands on one day's
   allowance. Without that, rent day would read as thousands over budget every
   month. */
let _recSigVer=-1,_recSigs=new Set();
function recSigs(){
  if(_recSigVer!==DATA_VER){_recSigs=new Set(detectRecurring().filter(r=>r.confidence>=45).map(r=>r.sig));_recSigVer=DATA_VER;}
  return _recSigs;
}
const isCommitted=e=>isFixedCat(e.category_id)||recSigs().has(signature(e))||manualIds().has(e.id);

let _mpCache=nullMap(),_mpVer=-1,_mpDay='';
function monthPlan(k){
  if(_mpVer!==DATA_VER||_mpDay!==today()){_mpCache=nullMap();_mpVer=DATA_VER;_mpDay=today();}
  if(_mpCache[k])return _mpCache[k];
  const inc=incomeFor(k);
  const [y,m]=k.split('-').map(Number), dim=new Date(y,m,0).getDate();
  const rows=live().filter(e=>monKey(e.spent_on)===k);
  const fixedSpent=sum(rows.filter(isCommitted));
  const isCur=k===monKey(today()), end=k+'-'+pad2(dim);
  let stillDue=0;
  const dueCats=new Set();
  if(isCur){
    for(const r of detectRecurring().filter(x=>x.confidence>=45)){
      let d=r.next,g=0;
      if(r.manual&&r.overdue&&monKey(d)===k){stillDue+=r.expect;dueCats.add(r.cat);d=stepRec(r,d);}
      while(d<=end&&g++<10){if(d>=today()){stillDue+=r.expect;dueCats.add(r.cat);}d=stepRec(r,d);}
    }
    // a fixed category not paid yet this month, with no forecast covering it: expect last month's amount
    const pk=monKey(addDays(k+'-01',-1));
    for(const c of CATS.filter(x=>x.is_fixed)){
      if(dueCats.has(c.id))continue;
      const thisMonth=sum(rows.filter(e=>e.category_id===c.id));   // not `now` — that shadows now()
      const before=sum(live().filter(e=>e.category_id===c.id&&monKey(e.spent_on)===pk));
      if(thisMonth===0&&before>0)stillDue+=before;
    }
  }
  const fixedTotal=fixedSpent+stillDue;
  // the month tracking began only gets the share of income for the days it covers
  const ts=trackStart();
  const share=(ts&&monKey(ts)===k&&ts>k+'-01')?(dim-parseD(ts).getDate()+1)/dim:1;
  const goal=inc*goalPct()*share;
  const out={k,inc:inc*share,goal,fixedSpent,stillDue,fixedTotal,dim,rows,isCur,
    pool:inc*share-goal-fixedTotal, ceilingPool:inc*share-fixedTotal,
    startDay:share<1?parseD(ts).getDate():1};
  _mpCache[k]=out;return out;
}

/* Plan for one calendar day, as it stood at the start of that day. */
function dayPlan(dateStr){
  const k=monKey(dateStr);
  if(!incomeFor(k))return null;
  const ts=trackStart();
  if(ts&&dateStr<ts)return null;
  const mp=monthPlan(k), day=parseD(dateStr).getDate();
  const daysLeft=mp.dim-Math.max(day,mp.startDay)+1;
  let before=0,spent=0;
  for(const e of mp.rows){
    if(isCommitted(e))continue;
    if(e.spent_on<dateStr)before+=e.amount;
    else if(e.spent_on===dateStr)spent+=e.amount;
  }
  const remain=mp.pool-before, remainCeil=mp.ceilingPool-before;
  /* Asymmetric on purpose. Overspending lowers the days that follow, so it gets
     absorbed. Underspending does NOT raise them: a pure rolling allowance climbed
     to several times the steady rate by month-end in testing, and late in the period is
     exactly where the study found remaining-budget displays drive overspending.
     The surplus is reported as being ahead of plan — savings if left alone. */
  const tracked=mp.dim-mp.startDay+1;
  const steady=Math.max(0,mp.pool/tracked), steadyCeil=Math.max(0,mp.ceilingPool/tracked);
  const rolling=Math.max(0,remain/daysLeft), rollingCeil=Math.max(0,remainCeil/daysLeft);
  const allowance=Math.min(steady,rolling), ceiling=Math.min(steadyCeil,rollingCeil);
  const ahead=remain-steady*daysLeft;          // >0 ahead of plan, <0 behind
  return{date:dateStr,allowance,ceiling,spent,left:allowance-spent,daysLeft,steady,ahead,
    monthOver:remain<0?-remain:0, mp,
    status:spent<=allowance?'under':spent<=ceiling?'stretch':'over'};
}

/* Typical day without an income figure: median of variable spending on days
   that had any, over the last 60 days. */
function typicalDay(){
  const since=addDays(today(),-60),t=nullMap();
  for(const e of live()){
    if(e.spent_on<since||e.spent_on>=today()||isCommitted(e))continue;
    t[e.spent_on]=(t[e.spent_on]||0)+e.amount;
  }
  const v=Object.values(t).sort((a,b)=>a-b);
  return v.length>=3?quantile(v,.5):null;
}

/* Logging consistency over the last n days. Deliberately not a streak:
   Silverman & Barasch (Journal of Consumer Research, 2023) found that once a
   streak breaks, people often abandon the activity entirely — the worst
   possible outcome for an app whose main failure mode is people stopping. A
   count of days logged has nothing to break. */
function loggedDays(n=7){
  const set=new Set(liveAll().map(e=>e.spent_on)), ts=trackStart(), out=[];
  for(let i=n-1;i>=0;i--){const d=addDays(today(),-i);out.push({d,on:set.has(d),pre:!ts||d<ts});}
  return out;
}

/* ══════════════════ 3b. DEEP ANALYTICS ══════════════════ */

/* Robust descriptive stats. Spending is strongly right-skewed — a few big
   days drag the mean far above what a normal day looks like — so the median
   and the median absolute deviation are the honest summary, with the mean
   shown alongside so the gap between them is visible. */
function quantile(sorted,q){
  if(!sorted.length)return 0;
  const p=(sorted.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);
  return lo===hi?sorted[lo]:sorted[lo]+(sorted[hi]-sorted[lo])*(p-lo);
}
function robust(values){
  const v=values.slice().sort((a,b)=>a-b),n=v.length;
  if(!n)return{n:0,median:0,mean:0,mad:0,q1:0,q3:0,min:0,max:0};
  const median=quantile(v,.5);
  const dev=v.map(x=>Math.abs(x-median)).sort((a,b)=>a-b);
  return{n,median,mean:v.reduce((a,b)=>a+b,0)/n,
    mad:quantile(dev,.5), q1:quantile(v,.25),q3:quantile(v,.75),
    min:v[0],max:v[n-1]};
}

/* Robust z-score on the log scale.
   Two corrections, both found by testing against real usage:
   1. Leys et al. (2013) define MAD with the consistency constant b = 1.4826, so
      that it estimates the standard deviation for normal data. The earlier code
      used raw MAD, which put the "2.5 MAD" threshold at about 1.7 SD — and in
      in practice flagged around a quarter of a month's entries as unusual.
   2. Individual expenditures are closer to lognormal than normal, so the test
      runs on log(amount). On raw amounts a symmetric rule over-flags the long
      upper tail that is simply how spending is shaped. */
function logZ(amount,history){
  const lv=history.filter(v=>v>0).map(Math.log);
  if(lv.length<5||!(amount>0))return null;
  const r=robust(lv), sigma=Math.max(1.4826*r.mad,0.1);
  return{z:(Math.log(amount)-r.median)/sigma,typical:Math.exp(r.median),n:lv.length};
}
function rollingMean(arr,w){
  return arr.map((_,i)=>{
    const from=Math.max(0,i-w+1),slice=arr.slice(from,i+1);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
}

/* Fixed vs variable. The recurring detector already identifies your committed
   payments; everything else is what you actually decide week to week. Standard
   personal-finance framing: fixed costs set the floor, variable is your room. */
function fixedVsVariable(key){
  const rec=detectRecurring();
  const sigs=new Set(rec.map(r=>r.sig));
  const rows=live().filter(e=>monKey(e.spent_on)===key);
  let fixed=0,variable=0;
  for(const e of rows)((sigs.has(signature(e))||isFixedCat(e.category_id)||manualIds().has(e.id))?fixed+=e.amount:variable+=e.amount);
  return{fixed,variable,total:fixed+variable,
    pct:fixed+variable?fixed/(fixed+variable)*100:0,baseline:rec.reduce((s,r)=>s+r.monthly,0)};
}

/* Variance bridge: which categories actually caused this month to differ from
   last month. Ordered by absolute impact, minor drivers folded into "Other",
   per standard waterfall practice — a bridge with 17 tiny bars explains nothing. */
/* Variance bridge. For the month in progress, both sides are cut at the same
   day of month — comparing 24 days of October against all 30 of September would
   report a drop that is really just the calendar. */
function bridge(curKey,prevKey,uptoDay){
  const cut=(st)=>{
    if(!uptoDay)return st;
    const rows=st.rows.filter(e=>parseD(e.spent_on).getDate()<=uptoDay);
    const byCat=nullMap();for(const e of rows)byCat[e.category_id]=(byCat[e.category_id]||0)+e.amount;
    return{...st,rows,byCat,total:sum(rows)};
  };
  const a=cut(monthStats(prevKey)),b=cut(monthStats(curKey));
  const ids=new Set([...Object.keys(a.byCat),...Object.keys(b.byCat)]);
  let d=[...ids].map(id=>({id,name:CATMAP[id]?CATMAP[id].name:id,
    delta:(b.byCat[id]||0)-(a.byCat[id]||0)})).filter(x=>Math.abs(x.delta)>=1);
  d.sort((x,y)=>Math.abs(y.delta)-Math.abs(x.delta));
  const top=d.slice(0,5),rest=d.slice(5);
  if(rest.length){const o=rest.reduce((t,x)=>t+x.delta,0);
    if(Math.abs(o)>=1)top.push({id:null,name:'Other ('+rest.length+')',delta:o});}
  return{from:a.total,to:b.total,steps:top,net:b.total-a.total,curKey,prevKey,uptoDay:uptoDay||null};
}

/* Unusual transactions. Leys et al. (2013) recommend median ± 2.5·MAD over
   mean ± SD, because the mean and SD are themselves distorted by the very
   outliers you're hunting. Compared within category — a big rent payment is
   not unusual, a big coffee is. */
function unusual(key){
  // Fixed costs are excluded: a rent payment is large by design, not unusual.
  const pool=live().filter(e=>!isFixedCat(e.category_id));
  const rows=pool.filter(e=>monKey(e.spent_on)===key);
  const hist=nullMap();
  for(const e of pool)(hist[e.category_id]??=[]).push(e.amount);
  const allAmts=pool.map(e=>e.amount);
  const out=[];
  for(const e of rows){
    const h=hist[e.category_id];
    // A category with almost no history has no norm to deviate from, so compare
    // against all spending instead — a one-off ₹28,000 flight is still unusual
    // even though it's the only flight.
    const useCat=h&&h.length>=5;
    const r=logZ(e.amount,useCat?h:allAmts);
    if(!r||r.z<2.5)continue;
    out.push({e,z:r.z,typical:r.typical,scope:useCat?CATMAP[e.category_id].name:'all spending',
      mult:r.typical?e.amount/r.typical:0});
  }
  return out.sort((a,b)=>b.z-a.z).slice(0,5);
}

/* Concentration. The 80/20 rule is usually quoted, rarely true — Byron Sharp's
   work puts the real ratio nearer 50/20 in consumer data. So measure it rather
   than assume it: report the actual share your biggest transactions carry. */
function concentration(key){
  const amts=live().filter(e=>monKey(e.spent_on)===key).map(e=>e.amount).sort((a,b)=>b-a);
  const total=amts.reduce((a,b)=>a+b,0);
  if(!total)return null;
  let run=0;const curve=amts.map(a=>{run+=a;return run/total;});
  const shareAt=p=>{const i=Math.max(0,Math.ceil(amts.length*p)-1);return curve[i]||0;};
  const txnsFor=s=>{const i=curve.findIndex(c=>c>=s);return i<0?amts.length:i+1;};
  return{n:amts.length,total,curve,
    top10:shareAt(.10),top20:shareAt(.20),
    txnsForHalf:txnsFor(.5), pctForHalf:txnsFor(.5)/amts.length*100};
}

/* Per-category monthly series for small multiples. Tufte's argument for the
   form: constant axes, many panels, so differences pop out at a glance. */
function categorySparks(nMonths=6){
  const keys=[];const d=new Date();d.setDate(1);
  for(let i=nMonths-1;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);
    const k=t.getFullYear()+'-'+pad2(t.getMonth()+1);
    if(coverage(k)>0)keys.push(k);}            // an untracked month is not a zero month
  if(keys.length<2)return [];
  const byCat=nullMap();
  for(const e of live()){
    const k=monKey(e.spent_on);if(!keys.includes(k))continue;
    (byCat[e.category_id]??=Object.fromEntries(keys.map(kk=>[kk,0])))[k]+=e.amount;
  }
  return Object.entries(byCat).map(([id,m])=>{
    const series=keys.map(k=>m[k]);
    const recent=series[series.length-1];
    const prior=series.slice(0,-1).filter((x,i)=>x>0&&fullMonth(keys[i]));
    const base=prior.length?prior.reduce((a,b)=>a+b,0)/prior.length:0;
    return{id,name:CATMAP[id].name,color:CATMAP[id].color,series,keys,
      recent,base,drift:base?(recent-base)/base*100:null};
  }).sort((a,b)=>b.recent-a.recent).slice(0,6);
}

/* Transaction-size distribution: does the month go on a few big hits, or a
   thousand cuts? Log-ish buckets, because the sizes span three orders. */
function sizeBuckets(key){
  const B=[[0,100],[100,300],[300,600],[600,1200],[1200,3000],[3000,Infinity]];
  const L=['<100','100-300','300-600','600-1.2k','1.2-3k','3k+'];
  const cnt=B.map(()=>0),val=B.map(()=>0);
  for(const e of live().filter(x=>monKey(x.spent_on)===key)){
    const i=B.findIndex(([lo,hi])=>e.amount>=lo&&e.amount<hi);
    if(i>=0){cnt[i]++;val[i]+=e.amount;}
  }
  return{labels:L,cnt,val};
}

/* Price-change detection. Every serious subscription tracker flags a price rise,
   because a quiet ₹150/month increase is invisible per charge and ₹1,800 a year
   in aggregate. Compare the recent occurrences of a recurring item against its
   earlier ones and report the step, when it happened, and the annual impact. */
function priceChanges(minPct=8){
  const out=[];
  for(const r of detectRecurring()){
    const g=r.entries;
    if(!g||g.length<4)continue;
    const k=Math.max(1,Math.min(2,Math.floor(g.length/3)));
    const recent=g.slice(-k), earlier=g.slice(0,-k);
    const rm=recent.reduce((s,e)=>s+e.amount,0)/recent.length;
    const em=earlier.reduce((s,e)=>s+e.amount,0)/earlier.length;
    if(!em||!rm)continue;
    const pct=(rm-em)/em*100;
    if(Math.abs(pct)<minPct)continue;
    let changedAt=recent[0].spent_on;
    for(const e of g)if(Math.abs(e.amount-rm)/rm<0.06){changedAt=e.spent_on;break;}
    out.push({r,from:em,to:rm,pct,changedAt,yearly:(rm-em)*(365/r.gap)});
  }
  return out.sort((a,b)=>Math.abs(b.yearly)-Math.abs(a.yearly));
}

/* Lapsed commitments. A recurring item that has missed more than a full extra
   cycle either stopped, or is still being paid and simply is not being logged.
   Both matter and the app cannot tell them apart, so it asks rather than asserts. */
function lapsed(){
  return detectRecurring()
    .filter(r=>!r.manual&&daysBetween(r.next,today())>r.gap*0.5)
    .map(r=>({r,since:daysBetween(r.last,today()),
      missed:Math.max(1,Math.floor(daysBetween(r.next,today())/r.gap)+1)}))
    .sort((a,b)=>b.r.monthly-a.r.monthly);
}

/* Forward cash flow. Every expense tracker looks backwards; the recurring
   detector already knows what is due and roughly when, which is enough to
   project the committed side of the next month. Only commitments are
   forecastable — discretionary spending is a decision, not a schedule. */
/* FUTURE — this forward view is the natural source for two things it does not
   do yet: an .ics calendar export of upcoming commitments, and a local
   Notification a day before a large one lands. Notifications on Android need
   the app opened at least once in the window; periodic background sync is
   unreliable enough that it should not be promised. */
function upcoming(days=30){
  const R=detectRecurring().filter(r=>r.confidence>=45);
  const end=addDays(today(),days), items=[];
  for(const r of R){
    let d=r.next, guard=0;
    if(d<today()){ items.push({r,date:d,overdue:true}); d=stepRec(r,d); }
    while(d<=end && guard++<15){ items.push({r,date:d,overdue:false}); d=stepRec(r,d); }
  }
  items.sort((a,b)=>a.date<b.date?-1:1);
  const committed=items.reduce((s,x)=>s+x.r.expect,0);
  // variable estimate from the last 60 days of non-recurring spend
  const sigs=new Set(R.map(r=>r.sig));
  const since=addDays(today(),-60);
  const varSpend=live().filter(e=>e.spent_on>=since&&!sigs.has(signature(e))&&!isFixedCat(e.category_id)&&!manualIds().has(e.id))
    .reduce((s,e)=>s+e.amount,0);
  const ts=trackStart();
  const window_=ts?Math.max(1,Math.min(60,daysBetween(ts>since?ts:since,today())+1)):60;
  const varPerDay=varSpend/window_;
  const cum=[];let run=0,i=0;
  for(let d=0;d<days;d++){
    const day=addDays(today(),d);
    while(i<items.length&&items[i].date<=day){run+=items[i].r.expect;i++;}
    cum.push(run);
  }
  return{items,committed,cum,days,end,varPerDay,varEstimate:varPerDay*days,
    overdue:items.filter(x=>x.overdue).length};
}

/* Annualised habit cost. Frequency × unit price is the number that actually
   lands — a ₹380 lunch reads differently as ₹3,000 a month. Only annualise
   from a window long enough to mean something: extrapolating a year from two
   events a week apart produces confident nonsense. */
function habits(){
  const g=nullMap();
  for(const e of live()){
    const k=(e.description||'').toLowerCase().trim();
    if(k.length<3)continue;
    const o=(g[k]??={n:0,total:0,first:e.spent_on,last:e.spent_on,cat:e.category_id,label:e.description});
    o.n++;o.total+=e.amount;
    if(e.spent_on<o.first)o.first=e.spent_on;
    if(e.spent_on>o.last){o.last=e.spent_on;o.cat=e.category_id;o.label=e.description;}
  }
  return Object.values(g).filter(h=>h.n>=4).map(h=>{
    const span=Math.max(daysBetween(h.first,h.last),1);
    const perMonth=h.total/span*30;
    return{...h,span,perMonth,perYear:perMonth*12,avg:h.total/h.n};
  }).filter(h=>h.span>=45)          // under ~6 weeks there is nothing to annualise
   .sort((a,b)=>b.perYear-a.perYear).slice(0,6);
}

/* Entry-time guard. The review-time outlier check runs days later, by which
   point a mistyped extra zero has already skewed the median, the bridge, the
   concentration curve and the recurring amounts. Catching it in the second
   before saving is worth far more. Threshold is stricter than review-time
   (3.5 MAD vs 2.5) because a false alarm here interrupts every entry. */
function entryWarnings(a){
  const out=[];
  if(!(a.amount>0))return out;
  const key=(a.desc||'').toLowerCase().trim();
  if(key.length>=3){
    const dup=live().find(e=>e.spent_on===a.date&&Math.abs(e.amount-a.amount)<0.01
      &&(e.description||'').toLowerCase().trim()===key);
    if(dup)out.push('You already logged ₹'+money(a.amount)+' for "'+esc(dup.description)+'" on this date.');
  }
  if(a.cat){
    const h=live().filter(e=>e.category_id===a.cat).map(e=>e.amount);
    const r=h.length>=6?logZ(a.amount,h):null;
    if(r&&r.z>=3.5){
      const mult=r.typical?a.amount/r.typical:0;
      out.push((mult>=2?mult.toFixed(1)+'× ':'Well above ')+'your usual ₹'+money(r.typical)
        +' for '+esc(CATMAP[a.cat].name)+'. Check for an extra zero.');
    }
  }
  return out;
}

/* How you pay: total, count and average ticket per method, across the last 90
   days. Only shown once enough entries carry a method to say anything. */
/* First month a projection can use is the first fully tracked month; the
   projection itself appears the month after that one completes. */
function projectionFrom(){
  const ts=trackStart();if(!ts)return monKey(today());
  const next=k=>monKey(addDays(k+'-28',7));
  const firstFull=fullMonth(monKey(ts))||parseD(ts).getDate()<=3?monKey(ts):next(monKey(ts));
  return next(firstFull);
}
function payMix(){
  const since=addDays(today(),-90), m=nullMap();
  let tagged=0,all=0;
  for(const e of live()){
    if(e.spent_on<since||isCommitted(e))continue;
    all++;
    if(!e.method||!METHODS[e.method])continue;
    tagged++;
    const o=(m[e.method]??={k:e.method,label:METHODS[e.method],total:0,n:0});
    o.total+=e.amount;o.n++;
  }
  const rows=Object.values(m).map(o=>({...o,avg:o.total/o.n})).sort((a,b)=>b.total-a.total);
  return{rows,tagged,all,total:rows.reduce((t,r)=>t+r.total,0)};
}

/* Data quality. Every number above assumes you logged everything. Days with no
   entry at all are the honest caveat — say so rather than quietly understating. */
function loggingGaps(key){
  const st=monthStats(key);
  const upto=st.isCur?new Date().getDate():st.dim;
  const ts=trackStart(), from=(ts&&monKey(ts)===key)?parseD(ts).getDate()-1:0;
  let blank=0;for(let i=from;i<upto;i++)if(st.daily[i]===0)blank++;
  const days=Math.max(0,upto-from);
  return{blank,upto:days,pct:days?blank/days*100:0};
}

/* ══════════════════ 3c. HERO CHART (range / metric / overlay / scrub) ══════════════════
   Modelled on stock-chart interaction: the timeframe selector sits directly under
   the chart rather than in a menu, because switching timeframe is the main thing
   you do here and any friction kills the exploration. Dragging across the chart
   moves a crosshair and updates the readout above it, so a value can be read at
   any point without hover — which does not exist on a phone. */
const RANGES={'1M':{days:30,bucket:'day'},'3M':{days:90,bucket:'day'},
  '6M':{days:182,bucket:'week'},'1Y':{days:365,bucket:'week'},'ALL':{days:null,bucket:'month'}};
const METRICS={spend:'Spend',count:'Entries',avg:'Avg size',cum:'Running total'};
let HERO=null;                                  // cached for the scrub handler

function bucketSpan(from,to,bucket){
  const out=[];
  if(bucket==='day'){
    for(let d=from;d<=to;d=addDays(d,1))out.push({from:d,to:d,label:dayLabel(d)});
  }else if(bucket==='week'){
    let end=to;const tmp=[];
    while(end>=from){
      const st=addDays(end,-6);
      tmp.push({from:st<from?from:st,to:end,label:'week to '+dayLabel(end)});
      end=addDays(end,-7);
      if(tmp.length>120)break;
    }
    out.push(...tmp.reverse());
  }else{
    let y=+from.slice(0,4),m=+from.slice(5,7);const endK=monKey(to);
    for(let g=0;g<400;g++){
      const k=y+'-'+pad2(m),dim=new Date(y,m,0).getDate();
      out.push({from:k+'-01',to:k+'-'+pad2(dim),label:monLabel(k)});
      if(k===endK)break;
      if(++m>12){m=1;y++;}
    }
  }
  return out;
}
function fillBuckets(buckets){
  const idx=nullMap();
  // "Everyday only" drops fixed costs: one rent payment is 50× a normal day and
  // flattens everything else into a line along the bottom of the chart.
  for(const e of live()){
    if(S.everyday&&isCommitted(e))continue;(idx[e.spent_on]??={s:0,n:0});idx[e.spent_on].s+=e.amount;idx[e.spent_on].n++;}
  return buckets.map(b=>{
    let s=0,n=0;
    for(let d=b.from;d<=b.to;d=addDays(d,1)){const x=idx[d];if(x){s+=x.s;n+=x.n;}}
    return{...b,sum:s,count:n};
  });
}
const metricOf=(b,m)=>m==='spend'?b.sum:m==='count'?b.count:m==='avg'?(b.count?b.sum/b.count:0):b.sum;

function heroData(){
  const all=live();
  if(!all.length)return null;
  const cfg=RANGES[S.range]||RANGES['3M'];
  const first=all.map(e=>e.spent_on).sort()[0];
  let days=cfg.days===null?Math.max(30,daysBetween(first,today())+1):cfg.days;
  let start=addDays(today(),-(days-1));
  const ts=trackStart(), clipped=!!(ts&&ts>start);
  if(clipped){start=ts;days=daysBetween(ts,today())+1;}   // window opens when tracking did
  const buckets=fillBuckets(bucketSpan(start,today(),cfg.bucket));
  let vals=buckets.map(b=>metricOf(b,S.metric));
  if(S.metric==='cum'){let r=0;vals=vals.map(v=>r+=v);}

  // previous equivalent window, same bucketing, for the compare overlay
  let prev=null,prevNote=null;
  if(S.compare&&clipped)prevNote='the previous period is before tracking began';
  if(S.compare&&!clipped&&ts&&addDays(start,-days)<ts)prevNote='the previous period is only partly tracked';
  if(S.compare&&!prevNote){
    const pEnd=addDays(start,-1),pStart=addDays(pEnd,-(days-1));
    const pb=fillBuckets(bucketSpan(pStart,pEnd,cfg.bucket));
    let pv=pb.map(b=>metricOf(b,S.metric));
    if(S.metric==='cum'){let r=0;pv=pv.map(v=>r+=v);}
    // align lengths so the two windows sit on the same x positions
    while(pv.length>vals.length)pv.shift();
    while(pv.length&&pv.length<vals.length)pv.unshift(pv[0]);
    prev=pv;
  }
  // trailing mean; meaningless on a running total, which is monotonic by construction
  const w=cfg.bucket==='day'?7:cfg.bucket==='week'?4:3;
  const smooth=(S.smooth&&S.metric!=='cum')?rollingMean(vals,w):null;

  const total=buckets.reduce((s,b)=>s+b.sum,0);
  const count=buckets.reduce((s,b)=>s+b.count,0);
  return{buckets,vals,prev,prevNote,clipped,smooth,smoothW:w,bucket:cfg.bucket,days,start,total,count,
    headline:S.metric==='count'?count:S.metric==='avg'?(count?total/count:0):total};
}

/* FUTURE — charts are SVG with no accessible fallback. A visually-hidden
   <table> of the same series would make them readable by a screen reader, and
   is far less work than it sounds since the data is already tabular. Pinch-zoom
   on a range is the other obvious gap. */
function heroSVG(H){
  const W=340,PT=10,PB=6,CH=140;
  const series=[H.vals,H.prev,H.smooth].filter(Boolean);
  const max=Math.max(1,...series.flat());
  const n=H.vals.length;
  const X=i=>n<2?W/2:(i/(n-1))*W;
  const Y=v=>PT+(CH-PT-PB)*(1-v/max);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  H.xy=H.vals.map((v,i)=>({x:X(i),y:Y(v)}));

  let s=`<svg viewBox="0 0 ${W} ${CH}" width="100%" style="display:block" role="img"
    aria-label="${esc(METRICS[S.metric])} over ${esc(S.range)}">`;
  for(let i=0;i<=3;i++){const y=PT+(CH-PT-PB)*i/3;
    s+=`<line class="grid" x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" opacity=".55"/>`;}
  if(H.prev)s+=`<path d="${path(H.prev)}" fill="none" stroke="${PAL.neutral}" stroke-width="1.6"
    stroke-dasharray="4 4" opacity=".8" stroke-linejoin="round"/>`;
  if(H.smooth){
    s+=`<path d="${path(H.vals)}" fill="none" stroke="${PAL.line2}" stroke-width="1.3" stroke-linejoin="round"/>`;
    s+=`<path d="${path(H.smooth)} L ${W} ${CH-PB} L 0 ${CH-PB} Z" fill="${PAL.hot}" opacity=".11"/>`;
    s+=`<path d="${path(H.smooth)}" fill="none" stroke="${PAL.hot}" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>`;
  }else{
    s+=`<path d="${path(H.vals)} L ${W} ${CH-PB} L 0 ${CH-PB} Z" fill="${PAL.hot}" opacity=".13"/>`;
    s+=`<path d="${path(H.vals)}" fill="none" stroke="${PAL.hot}" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  s+=`<g id="xh" opacity="0" pointer-events="none">
    <line id="xhLine" x1="0" y1="0" x2="0" y2="${CH}" stroke="${PAL.ink}" stroke-width="1" opacity=".55"/>
    <circle id="xhDot" cx="0" cy="0" r="4.5" fill="${PAL.hot}" stroke="${PAL.bg}" stroke-width="2"/></g>`;
  return s+'</svg>';
}

function heroReadout(idx){
  const H=HERO;if(!H)return '';
  const fmt=v=>S.metric==='count'?money(v)+' '+(v===1?'entry':'entries'):'₹'+money(v);
  if(idx===null||idx===undefined){
    const rangeLbl={'1M':'last 30 days','3M':'last 3 months','6M':'last 6 months',
      '1Y':'last 12 months','ALL':'all time'}[S.range];
    let sub=`${esc(METRICS[S.metric])}${S.everyday?' (excl. fixed costs)':''} · ${H.clipped?'since tracking began':rangeLbl}`;
    if(H.prevNote)sub+=` · <span class="dimc">no comparison: ${esc(H.prevNote)}</span>`;
    if(H.prev&&H.prev.length){
      const a=H.prev.reduce((x,y)=>x+y,0),b=H.vals.reduce((x,y)=>x+y,0);
      if(a>0){const d=(b-a)/a*100;
        sub+=` · <b class="${d>0?'bad':'good'}">${d>0?'+':''}${d.toFixed(0)}% vs previous</b>`;}
    }
    return `<div class="heroval num">${fmt(H.headline)}</div><div class="herosub">${sub}</div>`;
  }
  const b=H.buckets[idx],v=H.vals[idx];
  return `<div class="heroval num">${fmt(v)}</div>
    <div class="herosub">${esc(b.label)}${b.count?` · ${b.count} ${b.count===1?'entry':'entries'}`:' · nothing logged'}</div>`;
}

/* ══════════════════ 4b. DEEP CHART RENDERERS ══════════════════ */

function heatmapSVG(key){
  const st=monthStats(key);
  const [y,m]=key.split('-').map(Number);
  const first=new Date(y,m-1,1).getDay();
  const cells=first+st.dim, rows=Math.ceil(cells/7);
  const C=44,R=30,W=7*C,H=rows*R;
  const max=Math.max(...st.daily,1);
  const todayD=key===monKey(today())?new Date().getDate():-1;
  let s=`<svg viewBox="0 0 ${W} ${H+20}" width="100%" style="display:block" role="img"
    aria-label="Daily spending heatmap for ${monLabel(key)}">`;
  DOW.forEach((d,i)=>s+=`<text class="axis" x="${i*C+C/2}" y="11" text-anchor="middle">${d[0]}</text>`);
  for(let i=0;i<st.dim;i++){
    const idx=first+i,cx=(idx%7)*C,cy=Math.floor(idx/7)*R+20;
    const v=st.daily[i],t=v/max;
    const fill=v===0?PAL.heatEmpty:`rgba(${PAL.hotRGB},${(0.18+t*0.82).toFixed(2)})`;
    const dayStr=key+'-'+pad2(i+1);
    const future=dayStr>today();
    s+=`<rect x="${cx+2}" y="${cy}" width="${C-4}" height="${R-4}" rx="4" fill="${fill}"
        ${i+1===todayD?'stroke="'+PAL.ink+'" stroke-width="1.5"':''}
        ${future?'opacity=".35"':`data-day="${dayStr}" style="cursor:pointer"`}/>`;
    s+=`<text x="${cx+C/2}" y="${cy+(R-4)/2+3.5}" text-anchor="middle" pointer-events="none"
        font-size="10" font-family="var(--mono)" font-weight="600"
        fill="${t>0.55?PAL.onhot:(v===0?PAL.dim:PAL.ink)}">${i+1}</text>`;
  }
  return s+'</svg>';
}

function waterfallSVG(b){
  const steps=b.steps;
  const W=340,H=150,n=steps.length+2,gap=5,bw=(W-gap*(n-1))/n;
  const vals=[b.from,b.to];let run=b.from;
  for(const s of steps){vals.push(run,run+s.delta);run+=s.delta;}
  const lo=Math.min(0,...vals),hi=Math.max(...vals,1);
  const Y=v=>H-((v-lo)/(hi-lo))*H;
  let s=`<svg viewBox="0 0 ${W} ${H+38}" width="100%" style="display:block" role="img">`;
  s+=`<line class="grid" x1="0" y1="${Y(0)}" x2="${W}" y2="${Y(0)}" opacity=".7"/>`;
  const bar=(i,y0,y1,fill)=>{
    const x=i*(bw+gap),t=Math.min(y0,y1),h=Math.max(2,Math.abs(y1-y0));
    return `<rect x="${x.toFixed(1)}" y="${t.toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="2" fill="${fill}"/>`;
  };
  const lab=(i,txt,y,fill,wt)=>`<text class="axis" x="${(i*(bw+gap)+bw/2).toFixed(1)}" y="${y}"
    text-anchor="middle" ${fill?`fill="${fill}"`:''} ${wt?'font-weight="600"':''}>${txt}</text>`;
  s+=bar(0,Y(b.from),Y(0),PAL.barTotal)+lab(0,money(b.from),Y(b.from)-5,PAL.mute,1);
  run=b.from;
  steps.forEach((st,k)=>{
    const i=k+1,up=st.delta>0;
    s+=bar(i,Y(run),Y(run+st.delta),up?PAL.bad:PAL.good);
    const yTop=Math.min(Y(run),Y(run+st.delta));
    s+=lab(i,(up?'+':'−')+money(Math.abs(st.delta)),yTop-5,up?PAL.bad:PAL.good,1);
    run+=st.delta;
  });
  s+=bar(n-1,Y(b.to),Y(0),PAL.barTotal)+lab(n-1,money(b.to),Y(b.to)-5,PAL.mute,1);
  const names=[monLabel(b.prevKey||'').split(' ')[0]||'Prev',...steps.map(x=>x.name.split(' ')[0].slice(0,7)),
               monLabel(b.curKey||'').split(' ')[0]||'Now'];
  names.forEach((nm,i)=>{s+=lab(i,esc(nm),H+16);});
  return s+'</svg>';
}

function sparkSVG(data,color){
  const W=104,H=30,max=Math.max(...data,1);
  if(data.length<2)return '';
  const pts=data.map((v,i)=>[i/(data.length-1)*W,H-2-(v/max)*(H-6)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block;overflow:visible">
    <path d="${path} L ${W} ${H} L 0 ${H} Z" fill="${color}" opacity=".13"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="${color}"/></svg>`;
}

function paretoSVG(curve){
  const W=340,H=120,n=curve.length;
  if(n<2)return '';
  const pts=curve.map((c,i)=>[((i+1)/n)*W,H-c*H]);
  let s=`<svg viewBox="0 0 ${W} ${H+18}" width="100%" style="display:block" role="img">`;
  s+=`<line x1="0" y1="${H}" x2="${W}" y2="0" stroke="${PAL.line2}" stroke-width="1" stroke-dasharray="3 3"/>`;
  for(const q of [.5,.8]){
    const y=H-q*H;
    s+=`<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}" opacity=".6"/>
        <text class="axis" x="2" y="${y-4}">${q*100}% of spend</text>`;
  }
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')} L ${W} ${H} L 0 ${H} Z"
      fill="${PAL.hot}" opacity=".12"/>`;
  s+=`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')}"
      fill="none" stroke="${PAL.hot}" stroke-width="2" stroke-linejoin="round"/>`;
  s+=`<text class="axis" x="0" y="${H+14}">biggest</text>
      <text class="axis" x="${W}" y="${H+14}" text-anchor="end">smallest</text>`;
  return s+'</svg>';
}

function histSVG(h){
  const W=340,H=86,n=h.cnt.length,gap=6,bw=(W-gap*(n-1))/n;
  const max=Math.max(...h.val,1);
  let s=`<svg viewBox="0 0 ${W} ${H+30}" width="100%" style="display:block" role="img">`;
  h.val.forEach((v,i)=>{
    const ht=Math.max(v>0?2:0,v/max*H),x=i*(bw+gap);
    s+=`<rect x="${x.toFixed(1)}" y="${(H-ht).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${ht.toFixed(1)}" rx="2" fill="${PAL.hot}" opacity="${v?0.85:0.2}"/>`;
    s+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H+13}" text-anchor="middle">${esc(h.labels[i])}</text>`;
    if(h.cnt[i])s+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H+25}" text-anchor="middle"
        fill="${PAL.neutral}">${h.cnt[i]}×</text>`;
  });
  return s+'</svg>';
}

/* ══════════════════ 4. CHARTS (hand-rolled SVG, zero deps) ══════════════════ */
/* Mobile dataviz guidance is consistent: 3-4 colours, not a rainbow; make the
   value readable without hover, since there is no hover on a phone. So bars are
   one hue at two intensities, and the selected bar prints its own value. */
function barChart(data,labels,hi,tapAttr){
  const W=340,H=104,n=data.length,gap=4,bw=(W-gap*(n-1))/n;
  const max=Math.max(...data,1);
  let s=`<svg viewBox="0 0 ${W} ${H+34}" width="100%" style="display:block" role="img">`;
  data.forEach((v,i)=>{
    const h=Math.max(v>0?2:0,v/max*H),x=i*(bw+gap),y=H-h,on=i===hi;
    if(tapAttr)s+=`<rect x="${x.toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H+18}"
      fill="transparent" style="cursor:pointer" ${tapAttr}="${i}"/>`;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"
         fill="${on?PAL.hot:PAL.barOff}" pointer-events="none"/>`;
    if(on&&v>0)s+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${Math.max(9,y-6).toFixed(1)}"
         text-anchor="middle" fill="${PAL.hot2}" font-weight="600" pointer-events="none">${money(v)}</text>`;
    if(i%2===0||on)s+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H+16}" text-anchor="middle"
         ${on?'fill="'+PAL.hot+'"':''} pointer-events="none">${labels[i]}</text>`;
  });
  return s+'</svg>';
}
function lineChart(series){ // [{data,color,dash}]
  const W=340,H=130,P=4;
  const max=Math.max(1,...series.flatMap(s=>s.data));
  const len=Math.max(...series.map(s=>s.data.length));
  let s=`<svg viewBox="0 0 ${W} ${H+6}" width="100%" style="display:block">`;
  for(let i=0;i<=3;i++){const y=P+(H-P*2)*i/3;s+=`<line class="grid" x1="0" y1="${y}" x2="${W}" y2="${y}" opacity=".6"/>`;}
  series.forEach(ser=>{
    const d=ser.data;if(!d.length)return;
    const pts=d.map((v,i)=>[(i/(Math.max(1,len-1)))*W,P+(H-P*2)*(1-v/max)]);
    const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(ser.fill)s+=`<path d="${path} L ${pts[pts.length-1][0].toFixed(1)} ${H-P} L 0 ${H-P} Z" fill="${ser.color}" opacity=".10"/>`;
    s+=`<path d="${path}" fill="none" stroke="${ser.color}" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round" ${ser.dash?'stroke-dasharray="4 4" opacity=".75"':''}/>`;
  });
  return s+'</svg>';
}

/* ── Today card ──
   The top of the Add screen: one daily figure, a bar, and how the month stands.
   With income set, it's the allowance; without, today against your typical day. */
function todayCard(){
  const t=today(), tRows=live().filter(e=>e.spent_on===t);
  const [y,m]=t.split('-').map(Number), dim=new Date(y,m,0).getDate(), day=+t.slice(8);
  const pill=`<span class="pill">DAY ${day} / ${dim}</span>`;
  const dots=loggedDays(7);
  const nOn=dots.filter(d=>d.on).length, nCount=dots.filter(d=>!d.pre).length;
  const dotRow=nCount?`<div class="dots" aria-label="Logged ${nOn} of the last ${nCount} days">
      ${dots.map(d=>`<i class="${d.pre?'pre':d.on?'on':''}" title="${dayLabel(d.d)}"></i>`).join('')}
      <span>logged ${nOn} of the last ${nCount} day${nCount===1?'':'s'}</span></div>`:'';
  const P=dayPlan(t);
  if(!P){
    const spent=sum(tRows.filter(e=>!isCommitted(e))), typ=typicalDay();
    const pct=typ?Math.min(100,spent/typ/2*100):0;
    return `<div class="today">
      <div class="trow"><span class="lbl">Spent today</span>${pill}</div>
      <div class="tval num">₹${money(spent)}</div>
      ${typ?`<div class="tbar"><i style="width:${pct.toFixed(1)}%"></i><b style="left:50%"></b></div>
        <div class="tsub">${spent<=typ?'Under':'Over'} your typical day of <b>₹${money(typ)}</b></div>`
        :`<div class="tsub">Your typical day appears after a few days of logging.</div>`}
      <button class="chip sm" id="setIncome" style="margin-top:12px">Add income for a daily allowance</button>
      ${dotRow}
    </div>`;
  }
  const over=P.left<0;
  const fillPct=P.ceiling?Math.min(100,P.spent/P.ceiling*100):0;
  const markPct=P.ceiling?Math.min(100,P.allowance/P.ceiling*100):100;
  const tone=P.status==='under'?'':P.status==='stretch'?'warn':'bad';
  let monthLine;
  if(P.monthOver>0)monthLine=`This month is <b class="bad">₹${money(P.monthOver)} past plan</b>, so today's allowance is zero. It resets next month.`;
  else if(P.ahead>1)monthLine=`<b class="good">₹${money(P.ahead)} ahead</b> this month — unspent, it's savings.`;
  else if(P.ahead<-1)monthLine=`<b class="bad">₹${money(-P.ahead)} behind</b> — today's allowance absorbs it.`;
  else monthLine=`Right on plan for the month.`;
  return `<div class="today ${tone}" data-plan role="button" tabindex="0">
    <div class="trow"><span class="lbl">${over?'Over today':'Left today'}</span>
      <span class="trt"><span class="tgoal">SAVE ${Math.round(goalPct()*100)}% ›</span>${pill}</span></div>
    <div class="tval num">${over?'−':''}₹${money(Math.abs(P.left))}</div>
    <div class="tbar"><i style="width:${fillPct.toFixed(1)}%"></i><b style="left:${markPct.toFixed(1)}%"></b></div>
    <div class="tsub"><b>₹${money(P.spent)}</b> spent of <b>₹${money(P.allowance)}</b> · ceiling ₹${money(P.ceiling)}</div>
    <div class="tsub">${monthLine}</div>
    ${dotRow}
  </div>`;
}

/* ── Yesterday recap ──
   The reel's nightly verdict, as an in-app card on the first open of the next
   day. A scheduled notification at a fixed time isn't available to a web app
   on Android: the API for it (Notification Triggers) went to an origin trial
   in 2019 and never shipped, and push would need a server, which this app
   deliberately does not have. Phrasing is neutral by design — failure-focused
   reminders are what drove people away after broken streaks. */
function recapCard(){
  if(PREFS.recapSeen===today())return '';
  const yd=addDays(today(),-1), ts=trackStart();
  if(!ts||yd<ts)return '';
  const rows=live().filter(e=>e.spent_on===yd&&!isCommitted(e));
  const all=liveAll().filter(e=>e.spent_on===yd);
  let body;
  if(!all.length){
    body=`nothing logged. <button class="linkbtn" id="recapAdd">Add it</button>`;
  }else{
    const spent=sum(rows), P=dayPlan(yd);
    if(P){
      const diff=P.allowance-spent;
      body=`₹${money(spent)} of a ₹${money(P.allowance)} allowance — ${diff>=0
        ?`<b class="good">₹${money(diff)} under</b>, kept as savings.`
        :`<b class="bad">₹${money(-diff)} over</b>, spread across the rest of the month.`}`;
    }else{
      const typ=typicalDay();
      body=`₹${money(spent)} across ${rows.length} entr${rows.length===1?'y':'ies'}${typ?` — your typical day is ₹${money(typ)}`:''}.`;
    }
  }
  return `<div class="recap" role="status">
    <div class="rtxt"><b class="rlbl">Yesterday</b> ${body}</div>
    <button class="rx" id="recapX" aria-label="Dismiss">×</button></div>`;
}

/* ══════════════════ TRENDS ══════════════════
   Four views behind a segmented control rather than one long scroll. Harms et
   al. (2015) tested four layouts for long content on phones and found plain
   scrolling performed worst of the four, with tabs, menus and collapsible
   sections all doing better; NN/g's dashboard work says the same thing from the
   other side — split a dense view into a summary plus drill-down. Segmented
   controls are the right control here because these are views of one dataset
   within a single context, not separate destinations, and four stays under the
   five-segment limit for a phone.

   Each view carries exactly one period control, which is what makes the split
   worth doing: Overview is range-based, Where and When are month-based, Habits
   is all-time. Previously a range selector and a month picker sat on the same
   screen meaning different things. */
/* Material Design 3: avoid more than four tabs — at five or more the container
   becomes cramped — and never nest a set of tabs inside a tab. Absorbing the
   Recurring tab therefore meant consolidating to four, not adding a fifth. */
const TSECT=[['over','Overview'],['where','Categories'],['when','Patterns'],['comm','Committed']];

function insCtx(){
  const months=[...new Set(live().map(e=>monKey(e.spent_on)))].sort().reverse();
  if(!months.includes(S.insMonth))S.insMonth=months[0];
  const cur=monthStats(S.insMonth);
  const pi=months.indexOf(S.insMonth);
  const prevKey=(months[pi+1]&&fullMonth(months[pi+1]))?months[pi+1]:undefined;
  const prev=prevKey?monthStats(prevKey):null;
  const spentDays=cur.daily.slice(0,cur.elapsed).filter(v=>v>0);
  // like-for-like baseline: for the month in progress, last month cut at the same day
  let prevByCat=null;
  if(prev){
    if(cur.isCur){const dd=new Date().getDate();prevByCat=nullMap();
      for(const e of prev.rows)if(parseD(e.spent_on).getDate()<=dd)prevByCat[e.category_id]=(prevByCat[e.category_id]||0)+e.amount;}
    else prevByCat=prev.byCat;
  }
  return{months,cur,prevKey,prev,prevByCat,rday:robust(spentDays),
    br:prevKey?bridge(S.insMonth,prevKey,cur.isCur?new Date().getDate():null):null,
    fv:fixedVsVariable(S.insMonth), gaps:loggingGaps(S.insMonth),
    conc:concentration(S.insMonth), odd:unusual(S.insMonth),
    buckets:sizeBuckets(S.insMonth), sparks:categorySparks(6), HB:habits(), dow:dowPattern()};
}
const pctD=(a,b)=>b?((a-b)/b*100):null;
const arrow=v=>v>0?'▲':'▼';
const dcls=v=>v>0?'bad':'good';

/* Answer first. Tableau's eye-tracking work found big numbers command attention
   before anything else, so the top of the page states the conclusion in words
   and one large figure rather than opening with a chart to be interpreted. */
function headline(c){
  const {cur,prev,prevKey,br}=c;
  if(!cur.count)return `<div class="headline"><div class="hl">Nothing logged in ${monLabel(S.insMonth)}.</div></div>`;
  const d=(prev&&br)?pctD(br.to,br.from):null;
  let line;
  const ts=trackStart();
  if(d===null){
    const partial=!fullMonth(S.insMonth)&&!cur.isCur;
    line=`<b>₹${money(cur.total)}</b> ${cur.isCur?'so far ':''}in ${monLabel(S.insMonth)}, across ${cur.count} entr${cur.count===1?'y':'ies'}.`;
    if(partial)line+=` Tracking began ${dayLabel(ts)}, so this covers ${cur.elapsed} day${cur.elapsed===1?'':'s'}.`;
    else if(ts&&monKey(ts)<S.insMonth)line+=` Your first full month tracked — comparisons start next month.`;
  }else{
    const dir=d>0?'more':'less';
    line=cur.isCur
      ?`<b>₹${money(cur.total)}</b> so far in ${monLabel(S.insMonth)} — <b class="${dcls(d)}">${Math.abs(d).toFixed(0)}% ${dir}</b> than the same ${br.uptoDay} days of ${monLabel(prevKey)}.`
      :`<b>₹${money(cur.total)}</b> in ${monLabel(S.insMonth)} — <b class="${dcls(d)}">${Math.abs(d).toFixed(0)}% ${dir}</b> than ${monLabel(prevKey)}.`;
    if(br&&br.steps.length){
      const t=br.steps[0];
      line+=` Mostly <b>${esc(t.name)}</b>, ${t.delta>0?'up':'down'} ₹${money(Math.abs(t.delta))}.`;
    }
  }
  return `<div class="headline"><div class="hl">${line}</div></div>`;
}

function monthBar(c){
  return `<div class="mbar"><div class="scrollx">
    ${c.months.slice(0,14).map(m=>`<button class="chip sm ${m===S.insMonth?'on':''}" data-imon="${m}">${monLabel(m)}</button>`).join('')}
  </div></div>`;

    <div class="seg" style="margin:12px 0 0;padding:0 18px">

    </div>
    <div class="scrollx" style="margin-top:8px">
      ${Object.entries(METRICS).map(([k,l])=>`<button class="chip sm ${S.metric===k?'on':''}" data-metric="${k}">${l}</button>`).join('')}
    </div>
    <div class="scrollx" style="margin-top:8px">
      <button class="chip sm ${S.smooth?'on':''}" data-tog="smooth">${S.smooth?'✓ ':''}Smooth</button>

  <div class="sec">

    <div class="statbig">
      <div class="v num">₹${money(cur.total)}</div>
      <div class="d ${d===null?'dimc':dcls(d)}">${d===null?cur.count+' entries':
        arrow(d)+' '+Math.abs(d).toFixed(0)+'% vs '+(cur.isCur?'same days of ':'')+monLabel(prevKey)+' · '+cur.count+' entries'}</div>
    </div>
    <div class="kpis" style="margin-top:10px">
      <div class="kpi"><span class="lbl">Typical day</span><div class="v">₹${money(rday.median)}</div>
        <div class="d dimc">median${rday.mean>rday.median*1.15?', mean ₹'+money(rday.mean):''}</div></div>
      ${cur.isCur?`<div class="kpi"><span class="lbl">On track for</span><div class="v">₹${money(cur.projected)}</div>
        <div class="d dimc">at this run rate</div></div>`:

        <div class="d dimc">${cur.daily.indexOf(Math.max(...cur.daily))+1} ${monLabel(S.insMonth).split(' ')[0]}</div></div>
      <div class="kpi"><span class="lbl">Committed</span><div class="v">₹${money(c.fv.fixed)}</div>

/* ── Where ── */
function tWhere(c){
  const {cur,br,sparks}=c;
  const cats=Object.entries(cur.byCat).sort((a,b)=>b[1]-a[1]);
  const maxCat=cats.length?cats[0][1]:1;
  const bd=nullMap();for(const e of cur.rows){const k=(e.description||CATMAP[e.category_id].name).toLowerCase().trim();bd[k]=(bd[k]||0)+e.amount;}
  const top=Object.entries(bd).sort((a,b)=>b[1]-a[1]).slice(0,5);
  if(!cur.count)return monthBar(c)+'<div class="empty">Nothing logged this month.</div>';
  return `
  ${monthBar(c)}
  ${br?`<div class="sec">
    <span class="lbl">What moved the total</span>
    ${secNote('Ordered by impact. Red pushed it up, green pulled it down; small movers are folded into Other.')}
    <div class="card pad14">${waterfallSVG(br)}</div>
  </div>`:''}

  <div class="sec">
    <span class="lbl">Categories</span>
    <div class="card pad14">
    ${cats.map(([id,v])=>{
      const p=c.prevByCat?(c.prevByCat[id]||0):null, d=p?pctD(v,p):null;
      return `<div class="bar">
        <div class="top"><span style="display:flex;align-items:center;gap:8px;min-width:0">
          <i class="dot" style="background:${CATMAP[id].color}"></i>
          <b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(CATMAP[id].name)}</b></span>
          <span class="num" style="flex:none">₹${money(v)} <span class="dimc" style="font-size:11px">${(v/cur.total*100).toFixed(0)}%</span></span></div>
        <div class="track"><div class="fill" style="width:${(v/maxCat*100).toFixed(1)}%;background:${CATMAP[id].color}"></div></div>
        ${d!==null?`<div style="font-size:11px;margin-top:4px" class="${dcls(d)}">${arrow(d)} ${Math.abs(d).toFixed(0)}% vs ${cur.isCur?'same days last month':'prior month'}</div>`:''}
      </div>`}).join('')}
    </div>
  </div>

  ${sparks.length?`<div class="sec">
    <span class="lbl">Six-month drift</span>
    ${secNote('Same scale across every panel, so a category climbing stands out against the others.')}
    <div class="card" style="padding:6px 14px">
    ${sparks.map(sp=>`<div class="sparkrow">
      <div class="sparkmeta"><div class="t">${esc(sp.name)}</div>
        <div class="s num">₹${money(sp.recent)}${sp.drift===null?' <span class="dimc">new</span>':
          ` <span class="${sp.drift>15?'bad':sp.drift<-15?'good':'dimc'}">${sp.drift>0?'+':''}${sp.drift.toFixed(0)}%</span>`}</div></div>
      ${sparkSVG(sp.series,sp.color)}</div>`).join('')}
    </div>
  </div>`:''}

  ${top.length?`<div class="sec"><span class="lbl">Biggest items</span>
    <div class="card" style="padding:4px 14px">
    ${top.map(([k,v])=>`<div class="duerow"><div style="min-width:0;flex:1">
      <div class="t" style="text-transform:capitalize">${esc(k)}</div></div>
      <span class="num" style="font-weight:600;flex:none">₹${money(v)}</span></div>`).join('')}
    </div></div>`:''}

}

/* ── When ── */
function tWhen(c){
  const {cur,prev,prevKey,gaps,dow}=c;
  const PM=payMix();
  if(!cur.count)return monthBar(c)+'<div class="empty">Nothing logged this month.</div>';
  const cum=a=>{let t=0;return a.map(v=>t+=v);};
  return `
  ${monthBar(c)}
  <div class="sec">
    <span class="lbl">Every day of ${monLabel(S.insMonth)}</span>
    ${secNote('Darker is heavier. Tap any day to add an expense for that date.')}
    <div class="card" style="padding:12px 8px 8px">${heatmapSVG(S.insMonth)}</div>
    ${gaps.blank?`<div class="hint" style="padding:0 18px"><b>${gaps.blank} of ${gaps.upto} days have no entry.</b> Either you spent nothing, or missed logging — so every figure here is a floor, not a total.</div>`:
      `<div class="hint" style="padding:0 18px">Every day has an entry, so this month's figures are complete.</div>`}
  </div>

  ${prev?`<div class="sec">
    <span class="lbl">Pace vs ${monLabel(prevKey)}</span>
    ${secNote('Cumulative spend day by day. If the solid line sits above the dashed one, you are ahead of last month.')}
    <div class="card pad14">
      ${lineChart([{data:cum(prev.daily),color:PAL.neutral,dash:true},
                   {data:cum(cur.daily.slice(0,cur.elapsed)),color:PAL.hot,fill:true}])}
      <div class="legend"><span><i style="background:var(--hot)"></i>${monLabel(S.insMonth)}</span>
        <span><i style="background:var(--neutral)"></i>${monLabel(prevKey)}</span></div>
    </div></div>`:''}

  ${PM.tagged>=5?`<div class="sec">
    <span class="lbl">How you pay · last 90 days</span>
    <div class="card pad14">
    ${PM.rows.map(r=>`<div class="bar">
      <div class="top"><b style="font-weight:600">${r.label}</b>
        <span class="num">₹${money(r.total)} <span class="dimc" style="font-size:11px">${(r.total/PM.total*100).toFixed(0)}%</span></span></div>
      <div class="track"><div class="fill" style="width:${(r.total/PM.rows[0].total*100).toFixed(1)}%"></div></div>
      <div style="font-size:11px;margin-top:4px" class="dimc">${r.n} payment${r.n===1?'':'s'} · ₹${money(r.avg)} average</div>
    </div>`).join('')}
    </div>
    <div class="hint" style="padding:0 18px">In an IIIT Delhi study, 74% of UPI users said UPI makes them spend more — a scan doesn't carry the small sting of handing over cash. Compare the average payment above to see whether that holds for you.${PM.tagged<PM.all?` Based on ${PM.tagged} of ${PM.all} entries that have a method.`:''}</div>
  </div>`:PM.all>=10?`<div class="sec"><span class="lbl">How you pay</span>
    <div class="hint" style="padding:0">Add <b>upi</b>, <b>cash</b> or <b>card</b> when you log (or tap the Method chip) and this shows how your spending splits by payment method — and whether UPI payments run larger than cash ones.</div></div>`:''}

  <div class="sec">
    <span class="lbl">By weekday, all time</span>
    <div class="card pad14">${barChart(dow,DOW.map(d=>d[0]+d[1]),dow.indexOf(Math.max(...dow)))}</div>
  </div>

  <div class="sec">
    <span class="lbl">Transaction sizes</span>
    ${secNote('Bar height is total rupees; the count below is how many transactions.')}
    <div class="card pad14">${histSVG(c.buckets)}</div>
  </div>

  ${c.conc&&c.conc.n>4?`<div class="sec">
    <span class="lbl">Concentration</span>
    <div class="card pad14">${paretoSVG(c.conc.curve)}</div>
    <div class="hint" style="padding:0 18px">Your biggest <b>${c.conc.txnsForHalf}</b> of ${c.conc.n} transactions carry half the month; the top 20% carry <b>${(c.conc.top20*100).toFixed(0)}%</b>. The dashed diagonal is perfectly even spending.</div>
  </div>`:''}

  <div class="sec">
    <span class="lbl">Spread of a day</span>
    <div class="card pad14">
      <div class="statgrid">
        <div><span class="lbl">Median</span><div class="v num">₹${money(c.rday.median)}</div></div>
        <div><span class="lbl">Mean</span><div class="v num">₹${money(c.rday.mean)}</div></div>
        <div><span class="lbl">Quiet day</span><div class="v num">₹${money(c.rday.q1)}</div></div>
        <div><span class="lbl">Heavy day</span><div class="v num">₹${money(c.rday.q3)}</div></div>
      </div>
    </div>
    <div class="hint" style="padding:0 18px">${c.rday.mean>c.rday.median*1.15
      ?`Mean sits <b>${((c.rday.mean/c.rday.median-1)*100).toFixed(0)}% above</b> the median — a few large days pull the average up.`
      :'Mean and median are close, so no small group of days distorts the average.'}</div>
  </div>
  <div style="height:16px"></div>`;
}

/* ── Committed: the former Recurring tab, folded in ── */
function tCommitted(c){
  const R=detectRecurring();
  const addBtn=`<button class="chip sm" id="addCommit">+ Add a committed payment</button>`;
  if(!R.length)return `<div class="empty">Nothing recurring detected yet.<br><br>
    Detection needs <b>3 or more</b> entries with a similar description and a steady gap.
    Subscriptions, rent and fuel usually surface within two months — or add one yourself.
    <div style="margin-top:16px">${addBtn}</div></div>`;
  const monthly=R.reduce((s,r)=>s+r.monthly,0);
  const U=upcoming(S.horizon), pc=priceChanges(), lp=lapsed();
  const byMonth=nullMap();for(const x of U.items)(byMonth[monKey(x.date)]??=[]).push(x);
  const sorted=R.slice().sort((a,b)=>b.monthly-a.monthly);
  const max=sorted[0].monthly||1;
  return `
  <div class="sec" style="margin-top:14px">
    <div class="statbig">
      <div class="v num">₹${money(monthly*12)}</div>
      <div class="d dimc">committed per year · ₹${money(monthly)} a month across ${R.length} commitment${R.length===1?'':'s'}</div>
    </div>
    <div style="margin-top:12px">${addBtn}</div>
  </div>

  <div class="seg" style="margin:14px 0 0;padding:0 18px">
    ${[30,90].map(d=>`<button data-hz="${d}" class="${S.horizon===d?'on':''}">Next ${d} days</button>`).join('')}
  </div>
  ${secNote('A rolling forward view, so an annual renewal is visible weeks ahead rather than arriving as a surprise.')}
  <div class="sec">
    <div class="kpis">
      <div class="kpi"><span class="lbl">Already owed</span><div class="v">₹${money(U.committed)}</div>
        <div class="d dimc">${U.items.length} payment${U.items.length===1?'':'s'}</div></div>
      <div class="kpi"><span class="lbl">Plus variable</span><div class="v">₹${money(U.varEstimate)}</div>

    </div>
    <div class="card pad14" style="margin-top:10px">${lineChart([{data:U.cum,color:PAL.hot,fill:true}])}
      <div class="legend"><span>Today → ${dayLabel(U.end)}</span></div></div>
  </div>

  ${Object.keys(byMonth).sort().map(k=>`<div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <span class="lbl">Due in ${monLabel(k)}</span>
      <span class="num dimc" style="font-size:12.5px">₹${money(byMonth[k].reduce((s,x)=>s+x.r.expect,0))}</span></div>
    <div class="card" style="padding:4px 14px">
    ${byMonth[k].map(x=>`<div class="duerow ${x.overdue?'od':''}"${x.r.manual?` data-cm="${esc(x.r.id)}" role="button" tabindex="0"`:''}>
      <i class="dot" style="background:${CATMAP[x.r.cat].color}"></i>
      <div style="min-width:0;flex:1"><div class="t">${esc(x.r.label)}</div>
        <div class="s">${x.overdue?'<b class="hot">overdue · expected '+dayLabel(x.date)+'</b>':dayLabel(x.date)} · ${x.r.cadence.toLowerCase()}${x.r.manual?' · added by you':''}</div></div>
      <span class="num" style="font-weight:600;flex:none">₹${money(x.r.expect)}</span></div>`).join('')}
    </div></div>`).join('')}

  <div class="sec">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span class="lbl">What each costs</span>
      <div style="display:flex;gap:6px">
        <button class="chip sm ${!S.rannual?'on':''}" data-ann="0">Month</button>
        <button class="chip sm ${S.rannual?'on':''}" data-ann="1">Year</button></div>
    </div>
    <div class="card pad14">
    ${sorted.map(r=>`<div class="bar"${r.manual?` data-cm="${esc(r.id)}" role="button" tabindex="0"`:''}>
      <div class="top"><span style="display:flex;align-items:center;gap:8px;min-width:0">
        <i class="dot" style="background:${CATMAP[r.cat].color}"></i>
        <b style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:capitalize">${esc(r.label)}</b></span>
        <span class="num" style="flex:none">₹${money(S.rannual?r.monthly*12:r.monthly)}</span></div>
      <div class="track"><div class="fill" style="width:${(r.monthly/max*100).toFixed(1)}%;background:${CATMAP[r.cat].color}"></div></div>
      <div style="font-size:11px;margin-top:4px" class="dimc">${r.cadence} · ₹${money(r.expect)} next · ${r.manual?'added by you · tap to edit':(r.stable?'fixed':'₹'+money(r.min)+'–'+money(r.max))+' · '+r.confidence+'% confidence'}</div>

  ${lp.length?`<div class="sec">
    <span class="lbl">Stopped, or not logged?</span>

      <i class="dot" style="background:${CATMAP[x.r.cat].color}"></i>

    </div>
    <div class="hint" style="padding:0 18px">The app cannot tell a cancelled service from one you stopped logging, so it asks rather than assumes. If these stopped, that is <b>₹${money(lp.reduce((s,x)=>s+x.r.monthly*12,0))} a year</b> no longer going out.</div>
  </div>`:''}

  ${c.HB.length?`<div class="sec">
    <span class="lbl">What your habits cost a year</span>

}

function vInsights(){
  HERO=heroData();
  if(!live().length)return `<div class="hd"><h1>Trends</h1></div>

/* ══════════════════ MONEY ══════════════════
   Income turns absolute figures into ratios, which is where the meaning is:
   ₹58,000 spent means nothing on its own, ₹58,000 against ₹80,000 earned means
   a 27% savings rate. */
function commitSheet(id,draft){
  if(READONLY)return toast('Read-only — this is a backup view');
  const ex=id?COMMITS.find(c=>c.id===id&&!c.deleted_at):null;
  const dflt=CATMAP.bills?'bills':CATS[0].id;
  const st=draft||{label:ex?ex.label:'',amount:ex?String(ex.amount):'',cadence:ex?ex.cadence:'monthly',
    next:ex?commitNext(ex):today(),cat:ex&&CATMAP[ex.cat]?ex.cat:dflt,catManual:!!ex};
  const v=openSheet(`<h3>${ex?'Edit':'Add a'} committed payment</h3>
    <div class="pad">
      <div class="frow"><span class="lbl">What</span><input id="cLabel" maxlength="40" value="${esc(st.label)}" placeholder="Rent, SIP, insurance…"></div>
      <div class="frow"><span class="lbl">Amount</span>
        <input id="cAmt" type="number" inputmode="decimal" min="1" step="1" value="${esc(st.amount)}" placeholder="₹"></div>
      <div class="frow"><span class="lbl">Due</span><input id="cNext" type="date" min="${today()}" value="${esc(st.next)}"></div>
      <div class="gu">${Object.entries(MCAD).map(([k,c])=>
        `<button class="chip sm ${st.cadence===k?'on':''}" data-cc="${k}">${c.name}</button>`).join('')}</div>
      <div class="gu"><button class="chip on" id="cCat">
        <i class="dot" style="background:${CATMAP[st.cat].color}"></i><span>${esc(CATMAP[st.cat].name)}</span></button></div>
      <div class="hint">Set aside before your daily allowance is worked out. When you log the payment — same description,
        or the same category at about this amount — it counts as this one, so it is never counted twice.</div>
    </div>
    <div class="act"><button class="prim" id="cSave">${ex?'Save changes':'Add payment'}</button></div>
    ${ex?`<div class="act" style="margin-top:22px"><button class="del" id="cDel">Remove this payment</button></div>`:''}`);
  let cadence=st.cadence,cat=st.cat,catManual=st.catManual;
  const paintCat=()=>{const b=$('#cCat',v);b.querySelector('.dot').style.background=CATMAP[cat].color;
    b.querySelector('span').textContent=CATMAP[cat].name;};
  v.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>{cadence=b.dataset.cc;
    v.querySelectorAll('[data-cc]').forEach(x=>x.classList.toggle('on',x.dataset.cc===cadence));});
  $('#cLabel',v).addEventListener('input',e=>{          // follow the name until a category is picked by hand
    if(catManual)return;const g=guessCategory(e.target.value);if(g){cat=g.cat;paintCat();}});
  const grab=()=>({label:$('#cLabel',v).value,amount:$('#cAmt',v).value,next:$('#cNext',v).value||st.next,cadence,cat,catManual});
  $('#cCat',v).onclick=()=>{const cur=grab();closeSheet();
    catSheet(cat,c=>commitSheet(id,{...cur,cat:c,catManual:true}));};
  $('#cSave',v).onclick=async()=>{
    const g=grab(), label=g.label.trim().replace(/\s+/g,' '), amount=parseFloat(g.amount);
    if(!/[a-z]/i.test(label))return toast('Give it a name');
    if(!(amount>0))return toast('Enter the amount');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(g.next))return toast('Pick the due date');
    const t=now();
    const row={id:ex?ex.id:uid(),label,amount:Math.round(amount*100)/100,cadence,next:g.next,cat,
      created_at:ex?ex.created_at:t,updated_at:t,deleted_at:null};
    try{await saveCommits([...COMMITS.filter(c=>c.id!==row.id),row]);}
    catch(err){console.error(err);return toast('Could not save');}
    closeSheet();buzz();render();toast(ex?'Payment updated':'Payment added');
  };
  const del=$('#cDel',v);
  if(del)del.onclick=async()=>{
    const before=COMMITS;
    try{await saveCommits(COMMITS.map(c=>c.id===ex.id?{...c,deleted_at:now(),updated_at:now()}:c));}
    catch(err){console.error(err);return toast('Could not remove');}
    closeSheet();buzz(14);render();
    toastUndo('Removed '+ex.label,async()=>{
      try{await saveCommits(before.map(c=>c.id===ex.id?{...c,deleted_at:null,updated_at:now()}:c));render();toast('Restored');}
      catch(err){console.error(err);toast('Could not restore');}
    });
  };
}

function incomeSheet(opts={}){
  const yearly=S.incPeriod==='year';
  const shown=yearly?(INCOME.monthly*12):INCOME.monthly;
  const k=opts.k||S.insMonth||monKey(today());
  const ov=INCOME.overrides&&INCOME.overrides[k];
  const amtV=opts.amt!==undefined?opts.amt:(shown?String(Math.round(shown)):'');
  const ovV=opts.ov!==undefined?opts.ov:(ov!==undefined&&ov!==null?String(Math.round(ov)):'');
  const goalV=opts.goal!==undefined?opts.goal:String(Math.round(goalPct()*100));
  const v=openSheet(`<h3>Your income</h3>
    <div class="pad">
      <div class="seg" style="padding:0;margin-bottom:12px">
        <button data-ip="month" class="${!yearly?'on':''}">Per month</button>
        <button data-ip="year" class="${yearly?'on':''}">Per year</button>
      </div>
      <label class="lbl" for="incAmt">Take-home ${yearly?'per year':'per month'}</label>
      <input id="incAmt" class="quickin" type="number" inputmode="decimal" min="0"
        value="${esc(amtV)}" placeholder="what actually reaches your account">
      <div class="hint">Take-home, not gross — tax and deductions never land in your account, so counting them would flatter every ratio here.</div>
      <div style="height:18px"></div>
      <label class="lbl" for="incOv">Override for ${monLabel(k)} only</label>
      <input id="incOv" class="quickin" type="number" inputmode="decimal" min="0"
        value="${esc(ovV)}" placeholder="leave blank to use the usual figure">
      <div class="hint">For a month with an incentive, a bonus, or a gap.</div>
      <div style="height:18px"></div>
      <label class="lbl" for="incGoal">Save each month (% of take-home)</label>
      <input id="incGoal" class="quickin" type="number" inputmode="numeric" min="0" max="90" step="1"
        value="${esc(goalV)}">
      <div class="calc" id="incCalc" aria-live="polite"></div>
      <div class="hint">Set aside before your daily allowance is worked out. 20% is the savings share in the common 50/30/20 split — set 0 to plan with everything after fixed costs.</div>
    </div>
    <div class="act"><button class="prim" id="incSave">Save</button></div>
    ${hasIncome()?`<div class="act" style="margin-top:18px"><button class="del" id="incClear">Remove income</button></div>`:''}`);
  v.querySelectorAll('[data-ip]').forEach(b=>b.onclick=()=>{
    const to=b.dataset.ip;if(to===(yearly?'year':'month'))return;
    const a=parseFloat($('#incAmt',v).value);
    const amt=a>0?String(Math.round(to==='year'?a*12:a/12)):'';
    const keep={k,amt,ov:$('#incOv',v).value,goal:$('#incGoal',v).value};
    S.incPeriod=to;closeSheet();incomeSheet(keep);});
  /* Live split. The same arithmetic as the daily allowance, run on whatever is
     typed, so the effect of a savings percentage is visible before saving it. */
  const mp=monthPlan(k), tracked=mp.dim-mp.startDay+1, share=tracked/mp.dim;
  const calc=()=>{
    const raw=parseFloat($('#incAmt',v).value)||0, base=yearly?raw/12:raw;
    const o=parseFloat($('#incOv',v).value), inc=(o>0?o:base)*share;
    const g=Math.min(90,Math.max(0,parseFloat($('#incGoal',v).value)||0))/100;
    const box=$('#incCalc',v);
    if(!(inc>0)){box.innerHTML=`<div class="crow"><span>Enter your take-home above to see how it splits.</span></div>`;return;}
    const save=inc*g, left=inc-save-mp.fixedTotal, per=left/tracked;
    box.innerHTML=`<div class="clbl">${monLabel(k)}${share<1?' · from day '+mp.startDay:''}</div>
      <div class="crow"><span>Saved · ${Math.round(g*100)}%</span><b class="num">₹${money(save)}</b></div>
      <div class="crow"><span>Committed</span><b class="num">₹${money(mp.fixedTotal)}</b></div>
      <div class="crow tot"><span>Left to spend</span><b class="num${left<0?' bad':''}">${left<0?'−':''}₹${money(Math.abs(left))}</b></div>
      <div class="crow"><span>Per day, on plan</span><b class="num${left<0?' bad':' hot'}">₹${money(Math.max(0,per))}</b></div>
      <div class="cnote">Committed is fixed costs and recurring payments this month: ₹${money(mp.fixedSpent)} paid, ₹${money(mp.stillDue)} still due.</div>`;
  };
  ['#incAmt','#incOv','#incGoal'].forEach(q=>$(q,v).addEventListener('input',calc));
  calc();
  if(opts.focus==='goal'){const gi=$('#incGoal',v);
    setTimeout(()=>{try{gi.scrollIntoView({block:'center'});gi.focus();gi.select();}catch{}},80);}
  $('#incSave',v).onclick=async()=>{
    const raw=parseFloat($('#incAmt',v).value)||0;
    const monthly=yearly?raw/12:raw;
    const ovRaw=$('#incOv',v).value.trim();
    const overrides={...(INCOME.overrides||{})};
    if(ovRaw===''){delete overrides[k];}
    else{const n=parseFloat(ovRaw);if(n>0)overrides[k]=n;}
    const gRaw=parseFloat($('#incGoal',v).value);
    const goal=isFinite(gRaw)?Math.min(90,Math.max(0,gRaw))/100:goalPct();
    try{ await saveIncome({monthly,period:S.incPeriod,overrides,goalPct:goal}); }
    catch(err){ console.error(err); return toast('Could not save'); }
    closeSheet();render();toast('Income saved');
  };
  const cl=$('#incClear',v);
  if(cl)cl.onclick=async()=>{
    try{ await saveIncome({monthly:0,overrides:{}}); }
    catch(err){ console.error(err); return toast('Could not save'); }
    closeSheet();render();toast('Income removed');
  };
}

/* The reel's 30-day grid, made to mean something: each day coloured by how it
   went against that day's allowance — within it, past it but under the
   ceiling, or past the ceiling. Days before tracking began are left blank
   rather than shown as perfect. Tap a day to add to it. */
function allowanceCal(k){
  const [y,m]=k.split('-').map(Number), dim=new Date(y,m,0).getDate();
  const first=new Date(y,m-1,1).getDay(), t=today();
  let cells='',under=0,counted=0;
  for(let i=0;i<first;i++)cells+='<i class="ce"></i>';
  for(let d=1;d<=dim;d++){
    const ds=k+'-'+pad2(d);
    if(ds>t){cells+=`<i class="cf"><b>${d}</b></i>`;continue;}
    const P=dayPlan(ds);
    if(!P){cells+=`<i class="cu"><b>${d}</b></i>`;continue;}
    counted++;if(P.status==='under')under++;
    const cls=P.spent===0?'c0':P.status==='under'?'cg':P.status==='stretch'?'cw':'cb';
    cells+=`<button class="${cls}" data-day="${ds}" aria-label="${dayLabel(ds)}: ₹${money(P.spent)} of ₹${money(P.allowance)}">
      <b>${d}</b><span>${P.spent?compact(P.spent):''}</span></button>`;
  }
  return{html:`<div class="cal">${DOW.map(x=>`<em>${x[0]}</em>`).join('')}${cells}</div>`,under,counted};
}

function rateBar(rates){
  const W=340,H=96,n=rates.length,gap=4,bw=(W-gap*(n-1))/n;
  const vals=rates.map(r=>r.rate).filter(v=>v!==null);
  const lo=Math.min(0,...vals),hi=Math.max(10,...vals);
  const Y=v=>H-((v-lo)/(hi-lo))*H;
  let s=`<svg viewBox="0 0 ${W} ${H+20}" width="100%" style="display:block" role="img">`;
  const zero=Y(0);
  s+=`<line class="grid" x1="0" y1="${zero.toFixed(1)}" x2="${W}" y2="${zero.toFixed(1)}" opacity=".8"/>`;
  rates.forEach((r,i)=>{
    const x=i*(bw+gap);
    if(r.rate===null){
      s+=`<rect x="${x.toFixed(1)}" y="${(zero-2).toFixed(1)}" width="${bw.toFixed(1)}" height="2" fill="${PAL.barOff}"/>`;
    }else{
      const y=Y(r.rate),top=Math.min(y,zero),h=Math.max(2,Math.abs(y-zero));
      s+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}"
        rx="2" fill="${r.rate>=0?PAL.good:PAL.bad}"/>`;
    }
    if(i%2===0||i===n-1)s+=`<text class="axis" x="${(x+bw/2).toFixed(1)}" y="${H+14}"
      text-anchor="middle">${monLabel(r.key).split(' ')[0]}</text>`;
  });
  return s+'</svg>';
}

    e.deleted_at=now();e.updated_at=now();               // soft delete — survives a future sync
    try{ await DB.put('expenses',e); }
    catch(err){ Object.assign(e,keep); console.error(err); return toast('Could not delete'); }
    await reload();closeSheet();buzz(14);
    toastUndo('Deleted ₹'+money(e.amount),async()=>{
      e.deleted_at=null;e.updated_at=now();

      catch(err){ console.error(err); toast('Could not restore'); }

  $('#eSave',v).onclick=async()=>{
    if(READONLY)return toast('Read-only — this is a backup view');

    const keep={amount:e.amount,description:e.description,spent_on:e.spent_on,

    try{ await DB.put('expenses',e); }
    catch(err){ Object.assign(e,keep); console.error(err); return toast('Could not save changes'); }
    try{ await learn(e.description,e.category_id); }catch(err){ console.warn(err); }
    await reload();closeSheet();toast('Updated');
  };
}

/* ══════════════════ 8. ACTIONS ══════════════════ */
/* Re-entrancy guard against a double-tap minting two rows.
   Sound because the check and the set below are separated by no await —
   JavaScript cannot interleave another invocation into synchronous code — and
   the flag is released in a finally so no throw can wedge it permanently.
   Verified by firing three concurrent calls and asserting one row is written.
   Static analysers flag this shape as a race; it is not one here. */
let saving=false;
async function saveExpense(){
  if(READONLY)return toast('Read-only — this is a backup view');
  if(saving)return;                            // ─┐ no await between these two
  const a=addState();                          //  │ lines, so the guard holds
  if(!(a.amount>0))return;                     //  │
  saving=true;                                 // ─┘
  const btn=$('#save');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  const cat=a.cat||'misc';
  const t=now();
  const row={
    id:uid(), amount:Math.round(a.amount*100)/100, spent_on:a.date, category_id:cat,
    description:a.desc, method:a.method||null,
    created_at:t, updated_at:t, deleted_at:null, schema:SCHEMA_VERSION
  };
  try{
    await DB.put('expenses',row);
  }catch(err){
    // A write can fail on quota or a transaction abort. Say so and keep what
    // was typed — silently dropping the entry is the worst possible outcome.
    console.error('save failed',err);
    saving=false;
    if(btn){btn.disabled=false;btn.textContent=saveLabel();}
    toast('Could not save — nothing was recorded');
    return;
  }
  try{ if(S.catManual)await learn(row.description,cat); }   // confirmed choices only
  catch(err){ console.warn('categoriser learn failed',err); }  // never lose the expense over this
  finally{ saving=false; }                                   // released on every path
  EXP.unshift(row);DATA_VER++;
  buzz(14);toast('₹'+money2(row.amount)+' · '+CATMAP[cat].name);
  S.quick='';S.amount='';S.desc='';S.cat=null;S.catManual=false;S.dateManual=false;S.date=today();
  // the method you just used becomes the default — most people pay the same way most of the time
  if(row.method&&row.method!==PREFS.lastMethod)savePrefs({lastMethod:row.method});
  S.method=row.method||PREFS.lastMethod||null;S.methodManual=false;
  render();
  const f=$('#quick');if(f)f.focus();          // stay in flow for the next entry
}

function toCSV(){
  const head=['id','date','amount','category','description','method','created_at','updated_at'];
  const esc2=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const rows=live().slice().sort((a,b)=>a.spent_on<b.spent_on?-1:1)
    .map(e=>[e.id,e.spent_on,e.amount,(CATMAP[e.category_id]||{name:''}).name,e.description,e.method?METHODS[e.method]:'',e.created_at,e.updated_at].map(esc2).join(','));
  return head.join(',')+'\n'+rows.join('\n');
}
function download(name,text,type){
  const b=new Blob([text],{type});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
