<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ledger</title>
<meta name="theme-color" content="#0E0F12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Self-hosted. No CDN, no network call, no FOUT — the app is byte-complete offline. */
@font-face{font-family:'Archivo';src:url('fonts/archivo-var.woff2') format('woff2-variations');
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/plexmono-400.woff2') format('woff2');
  font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('fonts/plexmono-600.woff2') format('woff2');
  font-weight:600;font-display:swap;font-style:normal}
:root{
  --bg:#0E0F12; --surf:#16181D; --surf2:#1D2027; --surf3:#252932;
  --line:#282C35; --line2:#3A404C;
  --ink:#EAE7E1; --mute:#A3AAB8; --dim:#858C9A;
  --hot:#FF7A3D; --hot2:#FF9A66; --hotdim:#4A2314;
  --good:#6ECFA6; --bad:#FF6B6E;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --sans:'Archivo','Helvetica Neue',Helvetica,sans-serif;
  --nav:66px;
  --tap:44px;               /* WCAG 2.2 SC 2.5.5 (AAA) minimum target */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,106,43,.10),transparent 60%);
}
#app{position:relative;z-index:1;min-height:100%;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:none;border:none;outline:none;width:100%}

/* ---------- primitives ---------- */
.lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hair{height:1px;background:var(--line);border:0;margin:0}
.pad{padding:0 18px}
.hd{position:sticky;top:0;z-index:20;background:rgba(14,15,18,.92);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.hd .sub{margin-top:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;min-height:var(--tap);
      border-radius:999px;border:1px solid var(--line2);background:var(--surf2);
      font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--hotdim);border-color:var(--hot);color:var(--hot2)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 18px}
.scrollx::-webkit-scrollbar{display:none}
.muted{color:var(--mute)}.dimc{color:var(--dim)}
.hot{color:var(--hot)}.good{color:var(--good)}.bad{color:var(--bad)}
.empty{text-align:center;color:var(--dim);padding:44px 24px;font-size:14px}

/* ---------- add view ---------- */
.tape{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 10px}
.tape .big{font-family:var(--mono);font-size:15px;font-weight:600}
.amtwrap{padding:18px 18px 6px;text-align:right;position:relative}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(44px,15vw,60px);
     font-weight:600;letter-spacing:-.03em;line-height:1;word-break:break-all}
.amt .cur{color:var(--dim);font-size:.5em;font-weight:500;margin-right:8px;vertical-align:.25em}
.amt.zero{color:var(--dim)}
.fields{padding:6px 18px 0}
.frow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}
.frow .lbl{flex:none;width:52px}
#desc::placeholder{color:var(--dim)}
.gu{display:flex;gap:8px;align-items:center;padding:12px 0 2px;flex-wrap:wrap}
.quickin{width:100%;height:54px;margin-top:7px;padding:0 15px;border-radius:13px;
  background:var(--surf);border:1px solid var(--line2);font-size:17px;font-weight:500}
.quickin:focus{border-color:var(--hot);background:var(--surf2)}
.quickin::placeholder{color:var(--dim)}
.hint{font-size:12px;color:var(--mute);line-height:1.55;margin-top:9px}
.hint b{color:var(--ink);font-weight:600}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px 10px}
.key{height:52px;border-radius:11px;background:var(--surf);border:1px solid var(--line);
     font-family:var(--mono);font-size:22px;font-weight:400;display:flex;align-items:center;justify-content:center;
     transition:background .09s,transform .09s}
.key:active{background:var(--surf3);transform:scale(.96)}
.save{margin:6px 18px 20px;height:56px;width:calc(100% - 36px);border-radius:14px;background:var(--hot);color:#140A05;
      font-size:16px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;
      transition:transform .1s,opacity .15s}
.save:active{transform:scale(.985)}
.save[disabled]{background:var(--surf2);color:var(--dim);border:1px solid var(--line)}
.recent{padding:0 18px 12px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);text-align:left;
  padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rrow .rd{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- log ---------- */
.daygrp{margin-top:16px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px 7px}
.erow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);
      background:linear-gradient(var(--surf),var(--surf))}
.erow:active{background:var(--surf2)}
.erow .body{flex:1;min-width:0}
.erow .t{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .m{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.erow .v{font-family:var(--mono);font-size:15px;font-weight:600;flex:none}

/* ---------- insights ---------- */
.sec{margin:20px 18px}
.sec>.lbl{margin-bottom:10px;display:block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.kpi .d{font-size:11.5px;margin-top:3px;font-weight:600}
.bar{margin:11px 0}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;gap:8px}
.bar .track{height:7px;background:var(--surf2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--hot);transition:width .5s cubic-bezier(.2,.8,.2,1)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--mute);font-size:9.5px;font-family:var(--mono);letter-spacing:.02em}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}

.split{display:flex;flex-direction:column;gap:10px}
.splitbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.splitrow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500}
.splitrow span:first-child{display:flex;align-items:center;gap:8px}
.splitrow .num{font-weight:600}
.sparkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px dashed var(--line)}
.sparkrow:last-child{border-bottom:0}
.sparkmeta{min-width:0;flex:1}
.sparkmeta .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sparkmeta .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.oddrow{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;
  min-height:var(--tap);padding:11px 0;border-bottom:1px dashed var(--line)}
.oddrow:last-child{border-bottom:0}
.oddrow .t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oddrow .s{font-size:11px;color:var(--mute);margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.statgrid .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px}

/* ---------- recurring ---------- */
.rec{padding:13px 14px;border-radius:12px;background:var(--surf);border:1px solid var(--line);margin-bottom:10px}
.rec .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec .n{font-size:14.5px;font-weight:600;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--mute)}
.rec .meta span{background:var(--surf2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-weight:600}
.rec.due{border-color:var(--hot)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);
    background:rgba(14,15,18,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);height:var(--nav)}
nav button.on{color:var(--hot)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);
      display:flex;align-items:flex-end;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--surf);border-radius:20px 20px 0 0;
       border-top:1px solid var(--line2);padding:8px 0 calc(20px + env(safe-area-inset-bottom));
       animation:up .26s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 14px}
.sheet h3{margin:0 18px 14px;font-size:16px;font-weight:700}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px}
.catbtn{display:flex;align-items:center;gap:9px;padding:12px;min-height:52px;border-radius:11px;background:var(--surf2);
        border:1px solid var(--line);font-size:13.5px;font-weight:600;text-align:left}
.catbtn.on{border-color:var(--hot);background:var(--hotdim)}
.act{display:flex;gap:10px;padding:16px 18px 0}
.act button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line2);background:var(--surf2)}
.act .prim{background:var(--hot);color:#140A05;border-color:var(--hot)}
.act .del{color:var(--bad);border-color:#4A1F21;background:#231416}

.swipe{touch-action:pan-y}
.more{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 36px);margin:4px 18px 0;
  min-height:var(--tap);border-radius:11px;border:1px dashed var(--line2);color:var(--mute);font-size:13px;font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--surf2);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mute)}

.mrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:52px;
  padding:10px 12px;margin-bottom:6px;border-radius:11px;background:var(--surf2);border:1px solid var(--line)}
.mname{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:9px;border:2px solid transparent;min-height:34px}
.sw.on{border-color:var(--ink);transform:scale(1.06)}

/* ---------- misc ---------- */
.banner{margin:12px 18px;padding:11px 13px;border-radius:11px;font-size:12.5px;line-height:1.4;
        background:var(--hotdim);border:1px solid var(--hot);color:#FFC0A2}
.banner.warn{background:#231416;border-color:#4A1F21;color:#F0A9AB}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid var(--line)}
.setrow .t{font-size:14.5px;font-weight:500}
.setrow .s{font-size:11.5px;color:var(--dim);margin-top:2px}
.setrow button{min-height:var(--tap);padding:0 16px;border-radius:9px;background:var(--surf2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;flex:none}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 22px + env(safe-area-inset-bottom));transform:translateX(-50%);
       display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);
       background:var(--surf3);border:1px solid var(--line2);padding:0 8px 0 17px;min-height:48px;border-radius:999px;
       font-size:13px;font-weight:600;z-index:60;animation:tin .22s ease;white-space:nowrap;box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast .undo{min-height:36px;padding:0 15px;border-radius:999px;background:var(--hot);color:#140A05;font-weight:700;font-size:13px}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.seg{display:flex;gap:6px;padding:0 18px;margin-bottom:4px}
.seg button{flex:1;min-height:var(--tap);border-radius:10px;background:var(--surf);border:1px solid var(--line);
  font-size:13px;font-weight:700;color:var(--mute)}
.seg button.on{background:var(--hotdim);border-color:var(--hot);color:var(--hot2)}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>

<script>
'use strict';
/* ══════════════════ 0. UTIL ══════════════════ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const money=n=>{const v=Math.round(n||0);return v.toLocaleString('en-IN');};
const money2=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const monKey=s=>s.slice(0,7);
const monLabel=k=>{const[y,m]=k.split('-');return MON[+m-1]+" '"+y.slice(2);};
const dayLabel=s=>{const d=parseD(s),t=today();
  if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';
  return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(monKey(s)!==monKey(t)?' '+d.getFullYear():'');};

function toast(msg){const o=$('.toast');if(o)o.remove();
  const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);
  setTimeout(()=>e.remove(),1900);}
function buzz(ms=8){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* NN/g: don't spend confirmation dialogs on routine actions — they get
   click-through fatigue and stop working. Offer recovery instead. Deletes are
   already soft, so undo is a one-field flip. */
function toastUndo(msg,onUndo){
  const o=$('.toast');if(o)o.remove();
  const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');
  e.innerHTML=`<span>${esc(msg)}</span><button class="undo">Undo</button>`;
  document.body.appendChild(e);
  const kill=setTimeout(()=>e.remove(),6000);
  e.querySelector('.undo').onclick=()=>{clearTimeout(kill);e.remove();onUndo();};
}

/* ══════════════════ 1. STORAGE ══════════════════
   IndexedDB, schema shaped exactly like the SQL you'll port to Postgres/Room.
   Falls back to an in-memory store if IDB is blocked (e.g. sandboxed preview). */
const SCHEMA_VERSION=1;
const DB={
  db:null, mem:null,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('ledger',SCHEMA_VERSION);
        r.onerror=()=>rej(r.error);
        r.onblocked=()=>rej(new Error('blocked'));
        r.onupgradeneeded=e=>{
          const db=e.target.result;
          if(!db.objectStoreNames.contains('expenses')){
            const s=db.createObjectStore('expenses',{keyPath:'id'});
            s.createIndex('by_date','spent_on');
            s.createIndex('by_cat','category_id');
          }
          if(!db.objectStoreNames.contains('categories'))db.createObjectStore('categories',{keyPath:'id'});
          if(!db.objectStoreNames.contains('rules'))db.createObjectStore('rules',{keyPath:'token'});
          if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'k'});
        };
        r.onsuccess=()=>res(r.result);
        setTimeout(()=>rej(new Error('timeout')),4000);
      });
    }catch(err){
      console.warn('IndexedDB unavailable, using volatile memory store:',err);
      this.mem={expenses:new Map(),categories:new Map(),rules:new Map(),meta:new Map()};
    }
    return !!this.db;
  },
  _tx(store,mode){return this.db.transaction(store,mode,{durability:'strict'});},
  async all(store){
    if(this.mem)return[...this.mem[store].values()];
    return new Promise((res,rej)=>{const r=this._tx(store,'readonly').objectStore(store).getAll();
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  },
  async get(store,key){
    if(this.mem)return this.mem[store].get(key)||null;
    return new Promise((res,rej)=>{const r=this._tx(store,'readonly').objectStore(store).get(key);
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});
  },
  /* atomic multi-record put: all rows land or none do */
  async put(store,rows){
    rows=Array.isArray(rows)?rows:[rows];
    if(this.mem){rows.forEach(r=>this.mem[store].set(r[keyOf(store)],r));return;}
    return new Promise((res,rej)=>{
      const tx=this._tx(store,'readwrite'),os=tx.objectStore(store);
      rows.forEach(r=>os.put(r));
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
    });
  },
  async del(store,key){
    if(this.mem){this.mem[store].delete(key);return;}
    return new Promise((res,rej)=>{const tx=this._tx(store,'readwrite');
      tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
  }
};
const keyOf=s=>s==='rules'?'token':s==='meta'?'k':'id';

/* Durability: ask the browser to never evict us. Granted for installed PWAs. */
async function requestPersist(){
  if(!navigator.storage||!navigator.storage.persist)return null;
  try{
    if(await navigator.storage.persisted())return true;
