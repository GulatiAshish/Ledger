<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Ashish Gulati">
<meta name="description" content="Offline-first expense tracker. No account, no server, no data leaves your device.">
<meta name="copyright" content="Copyright 2026 Ashish Gulati. All rights reserved.">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ledger</title>
<meta name="theme-color" content="#0E0F12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Self-hosted. No CDN, no network call, no FOUT — the app is byte-complete offline. */
@font-face{font-family:'Archivo';src:url('archivo-var.woff2') format('woff2-variations');
  font-weight:400 700;font-display:swap;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('plexmono-400.woff2') format('woff2');
  font-weight:400;font-display:swap;font-style:normal}
@font-face{font-family:'IBM Plex Mono';src:url('plexmono-600.woff2') format('woff2');
  font-weight:600;font-display:swap;font-style:normal}
:root{
  --bg:#0E0F12; --surf:#16181D; --surf2:#1D2027; --surf3:#252932;
  --line:#282C35; --line2:#3A404C;
  --ink:#EAE7E1; --mute:#A3AAB8; --dim:#858C9A;
  --hot:#FF7A3D; --hot2:#FF9A66; --hotdim:#4A2314;
  --good:#6ECFA6; --bad:#FF6B6E;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --sans:'Archivo','Helvetica Neue',Helvetica,sans-serif;
  --nav:66px;
  --tap:44px;               /* WCAG 2.2 SC 2.5.5 (AAA) minimum target */
  --onhot:#140A05; --hotRGB:255,122,61;
  --neutral:#858C9A; --barOff:#333A46; --barTotal:#4A5160; --heatEmpty:#1B1E25; --amber:#F5B942;
  --glass:rgba(14,15,18,.92); --glass2:rgba(14,15,18,.94);
  --warnbg:#231416; --warnline:#4A1F21; --warnink:#F0A9AB; --nudgeink:#FFC0A2;
  --hl1:#1E2128; --hl2:#16181D;
  --glowA:rgba(255,106,43,.10); --glowB:rgba(110,92,255,.09);
  --veil:rgba(0,0,0,.62); --shadow:rgba(0,0,0,.5);
  color-scheme:dark;
}
/* Light theme. NN/g, citing Piepenbrock et al. (2013): for people with normal
   vision, dark text on a light background gives better visual acuity and
   proofreading accuracy, and the advantage grows as text gets smaller. Their
   advice is to follow the operating system and let people choose, rather than
   forcing dark — which this app previously did. */
:root[data-theme="light"]{
  --bg:#F5F4F0; --surf:#FFFFFF; --surf2:#F0EEE9; --surf3:#E6E3DC;
  --line:#E3E0D9; --line2:#CFCBC2;
  --ink:#17191E; --mute:#525866; --dim:#646A77;
  --good:#0B7A55; --bad:#C0262D; --amber:#9A6200;
  --neutral:#767C88; --barOff:#DCD9D2; --barTotal:#A3A8B2; --heatEmpty:#ECEAE5;
  --glass:rgba(245,244,240,.92); --glass2:rgba(245,244,240,.95);
  --warnbg:#FDECEC; --warnline:#F0C2C4; --warnink:#8F1D22; --nudgeink:#6B2A08;
  --hl1:#FFFFFF; --hl2:#F8F7F3;
  --glowA:rgba(194,65,12,.06); --glowB:rgba(110,92,255,.05);
  --veil:rgba(20,20,25,.42); --shadow:rgba(0,0,0,.14);
  color-scheme:light;
}
/* Accents. Ember is the original. When lime is chosen, "good" moves to teal so
   that one colour never means both "selected" and "under budget". */
:root[data-accent="lime"]  {--hot:#A3E635;--hot2:#BEF264;--hotdim:#2A3A10;--onhot:#0D1404;--hotRGB:163,230,53;--good:#2DD4BF;--glowA:rgba(163,230,53,.08)}
:root[data-accent="violet"]{--hot:#A78BFA;--hot2:#C4B5FD;--hotdim:#2E2550;--onhot:#120A24;--hotRGB:167,139,250;--glowA:rgba(167,139,250,.10)}
:root[data-accent="ocean"] {--hot:#38BDF8;--hot2:#7DD3FC;--hotdim:#0D3247;--onhot:#04131C;--hotRGB:56,189,248;--glowA:rgba(56,189,248,.09)}
:root[data-theme="light"]{--hot:#C2410C;--hot2:#9A3412;--hotdim:#FFE7D9;--onhot:#FFFFFF;--hotRGB:194,65,12}
:root[data-theme="light"][data-accent="lime"]  {--hot:#4D7C0F;--hot2:#3F6212;--hotdim:#E8F7CC;--onhot:#FFFFFF;--hotRGB:77,124,15;--good:#0F766E}
:root[data-theme="light"][data-accent="violet"]{--hot:#6D28D9;--hot2:#5B21B6;--hotdim:#EDE7FE;--onhot:#FFFFFF;--hotRGB:109,40,217}
:root[data-theme="light"][data-accent="ocean"] {--hot:#0369A1;--hot2:#075985;--hotdim:#DFF1FC;--onhot:#FFFFFF;--hotRGB:3,105,161}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:radial-gradient(120% 55% at 50% -12%,var(--glowA),transparent 62%),radial-gradient(70% 40% at 100% 0%,var(--glowB),transparent 70%);
}
#app{position:relative;z-index:1;min-height:100%;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));}
button{font-family:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:none;border:none;outline:none;width:100%}

/* ---------- primitives ---------- */
.lbl{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hair{height:1px;background:var(--line);border:0;margin:0}
.pad{padding:0 18px}
.hd{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hd h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.hd .sub{margin-top:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;min-height:var(--tap);
      border-radius:999px;border:1px solid var(--line2);background:var(--surf2);
      font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--hotdim);border-color:var(--hot);color:var(--hot2)}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;scroll-behavior:auto!important}
}
.dot{width:8px;height:8px;border-radius:2px;flex:none}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 18px}
.scrollx::-webkit-scrollbar{display:none}
.muted{color:var(--mute)}.dimc{color:var(--dim)}
.hot{color:var(--hot)}.good{color:var(--good)}.bad{color:var(--bad)}
.empty{text-align:center;color:var(--dim);padding:44px 24px;font-size:14px}

/* ---------- add view ---------- */
.tape{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px 10px}
.tape .big{font-family:var(--mono);font-size:15px;font-weight:600}
.amtwrap{padding:8px 18px 4px;text-align:right;position:relative}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:clamp(44px,15vw,60px);
     font-weight:600;letter-spacing:-.03em;line-height:1;word-break:break-all}
.amt .cur{color:var(--dim);font-size:.5em;font-weight:500;margin-right:8px;vertical-align:.25em}
.amt.zero{color:var(--dim);font-size:clamp(32px,10vw,42px)}
.fields{padding:6px 18px 0}
.frow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}
.frow .lbl{flex:none;width:52px}
#desc::placeholder{color:var(--dim)}
.gu{display:flex;gap:8px;align-items:center;padding:12px 0 2px;flex-wrap:wrap}
.quickin{width:100%;height:54px;margin-top:7px;padding:0 15px;border-radius:13px;
  background:var(--surf);border:1px solid var(--line2);font-size:17px;font-weight:500}
.quickin:focus{border-color:var(--hot);background:var(--surf2)}
.quickin::placeholder{color:var(--dim)}
.hint{font-size:12px;color:var(--mute);line-height:1.55;margin-top:9px}
.hint b{color:var(--ink);font-weight:600}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.12em;color:var(--dim)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 18px 10px}
.key{height:52px;border-radius:11px;background:var(--surf);border:1px solid var(--line);
     font-family:var(--mono);font-size:22px;font-weight:400;display:flex;align-items:center;justify-content:center;
     transition:background .09s,transform .09s}
.key:active{background:var(--surf3);transform:scale(.96)}
.save{margin:6px 18px 20px;height:56px;width:calc(100% - 36px);border-radius:14px;background:var(--hot);color:var(--onhot);
      font-size:16px;font-weight:700;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:10px;
      transition:transform .1s,opacity .15s}
.save:active{transform:scale(.985)}
.save[disabled]{background:var(--surf2);color:var(--dim);border:1px solid var(--line)}
.recent{padding:0 18px 12px}
.rrow{display:flex;align-items:center;gap:10px;width:100%;min-height:var(--tap);text-align:left;
  padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.rrow .rd{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- log ---------- */
.daygrp{margin-top:16px}
.dayhd{display:flex;justify-content:space-between;align-items:baseline;padding:0 18px 7px}
.erow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);
      background:linear-gradient(var(--surf),var(--surf))}
.erow:active{background:var(--surf2)}
.erow .body{flex:1;min-width:0}
.erow .t{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.erow .m{font-size:11px;color:var(--dim);margin-top:2px;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.erow .v{font-family:var(--mono);font-size:15px;font-weight:600;flex:none}

.subnav{position:sticky;top:calc(env(safe-area-inset-top) + 50px);z-index:19;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 18px 11px;
  background:var(--glass2);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.subnav button{min-height:38px;border-radius:9px;background:var(--surf);border:1px solid var(--line);
  font-size:12.5px;font-weight:700;color:var(--mute);letter-spacing:.01em}
.subnav button.on{background:var(--hotdim);border-color:var(--hot);color:var(--hot2)}
.headline{margin:16px 18px 4px;padding:15px 16px;border-radius:14px;
  background:linear-gradient(160deg,var(--hl1),var(--hl2));border:1px solid var(--line2)}
.headline .hl{font-size:15px;line-height:1.55;color:var(--mute)}
.headline .hl b{color:var(--ink);font-weight:700}
.headline .hl b.bad{color:var(--bad)}.headline .hl b.good{color:var(--good)}
.headline .hlsub{font-size:11.5px;color:var(--dim);margin-top:9px;font-weight:600}
.subnav.sub3{grid-template-columns:repeat(3,1fr)}
.duerow.od{border-left:2px solid var(--hot);padding-left:9px;margin-left:-11px}
.statbig{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px}
.statbig .v{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1}
.statbig .d{font-size:12.5px;font-weight:600;margin-top:8px}
.secnote{font-size:12px;color:var(--mute);line-height:1.5;margin:8px 0 10px;padding:0 18px}
.sec .secnote{margin:0 0 10px;padding:0}
.mbar{padding:14px 0 2px}
.pad14{padding:14px 12px 10px}

/* ---------- hero chart ---------- */
.hero{padding:14px 0 4px}
.heroread{padding:0 18px 12px;min-height:62px}
.heroval{font-size:32px;font-weight:600;letter-spacing:-.025em;line-height:1.1}
.herosub{font-size:12.5px;color:var(--mute);margin-top:5px}
.herosub b{font-weight:700}
#heroChart{touch-action:none;cursor:crosshair;padding:0 2px;user-select:none;-webkit-user-select:none}
.chip.sm{min-height:38px;font-size:12.5px;padding:0 13px}
.chip[disabled]{opacity:.4}
.hero .seg button{min-height:40px;font-size:12.5px;letter-spacing:.04em}

/* ---------- insights ---------- */
.sec{margin:20px 18px}
.sec>.lbl{margin-bottom:10px;display:block}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.kpi .d{font-size:11.5px;margin-top:3px;font-weight:600}
.bar{margin:11px 0}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;gap:8px}
.bar .track{height:7px;background:var(--surf2);border-radius:4px;margin-top:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;background:var(--hot);transition:width .5s cubic-bezier(.2,.8,.2,1)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .axis{fill:var(--mute);font-size:9.5px;font-family:var(--mono);letter-spacing:.02em}
.legend{display:flex;gap:14px;font-size:11px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}

.split{display:flex;flex-direction:column;gap:10px}
.splitbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px}
.splitrow{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:500}
.splitrow span:first-child{display:flex;align-items:center;gap:8px}
.splitrow .num{font-weight:600}
.sparkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px dashed var(--line)}
.sparkrow:last-child{border-bottom:0}
.sparkmeta{min-width:0;flex:1}
.sparkmeta .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sparkmeta .s{font-size:11.5px;color:var(--mute);margin-top:2px}
.oddrow{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;gap:12px;
  min-height:var(--tap);padding:11px 0;border-bottom:1px dashed var(--line)}
.oddrow:last-child{border-bottom:0}
.oddrow .t{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oddrow .s{font-size:11px;color:var(--mute);margin-top:2px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px}
.statgrid .v{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:4px}

/* ---------- recurring ---------- */
.rec{padding:13px 14px;border-radius:12px;background:var(--surf);border:1px solid var(--line);margin-bottom:10px}
.rec .h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rec .n{font-size:14.5px;font-weight:600;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--mute)}
.rec .meta span{background:var(--surf2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-weight:600}
.rec.due{border-color:var(--hot)}

/* ---------- nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav) + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);
    background:var(--glass2);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--dim);height:var(--nav)}
nav button.on{color:var(--hot)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav span{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

/* ---------- sheet ---------- */
.veil{position:fixed;inset:0;z-index:50;background:var(--veil);backdrop-filter:blur(3px);
      display:flex;align-items:flex-end;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-height:88vh;overflow:auto;background:var(--surf);border-radius:20px 20px 0 0;
       border-top:1px solid var(--line2);padding:8px 0 calc(20px + env(safe-area-inset-bottom));
       animation:up .26s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:8px auto 14px}
.sheet h3{margin:0 18px 14px;font-size:16px;font-weight:700}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px}
.catbtn{display:flex;align-items:center;gap:9px;padding:12px;min-height:52px;border-radius:11px;background:var(--surf2);
        border:1px solid var(--line);font-size:13.5px;font-weight:600;text-align:left}
.catbtn.on{border-color:var(--hot);background:var(--hotdim)}
.act{display:flex;gap:10px;padding:16px 18px 0}
.act button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:14.5px;border:1px solid var(--line2);background:var(--surf2)}
.act .prim{background:var(--hot);color:var(--onhot);border-color:var(--hot)}
.act .del{color:var(--bad);border-color:var(--warnline);background:var(--warnbg)}

.swipe{touch-action:pan-y}
.more{display:flex;align-items:center;justify-content:center;gap:8px;width:calc(100% - 36px);margin:4px 18px 0;
  min-height:var(--tap);border-radius:11px;border:1px dashed var(--line2);color:var(--mute);font-size:13px;font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--surf2);border:1px solid var(--line);
  font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--mute)}

.mrow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;min-height:52px;
  padding:10px 12px;margin-bottom:6px;border-radius:11px;background:var(--surf2);border:1px solid var(--line)}
.mname{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:9px;border:2px solid transparent;min-height:34px}
.sw.on{border-color:var(--ink);transform:scale(1.06)}

.duerow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px dashed var(--line)}
.duerow:last-child{border-bottom:0}
.duerow .t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.duerow .s{font-size:11px;color:var(--mute);margin-top:2px}

.about{margin:0 18px;padding:16px;border-radius:14px;background:var(--surf);border:1px solid var(--line)}
.about .an{font-size:16px;font-weight:700;letter-spacing:-.01em}
.about .av{font-size:12px;font-weight:600;color:var(--dim);margin-left:6px}
.about .ab{font-size:12.5px;color:var(--mute);margin-top:5px;line-height:1.5}
.about .ab b{color:var(--ink);font-weight:600}

/* ---------- today card ---------- */
.hd2{display:flex;align-items:baseline;justify-content:space-between}
.today{margin:12px 18px 2px;padding:14px 15px 12px;border-radius:18px;background:linear-gradient(165deg,var(--hl1),var(--hl2));
  border:1px solid var(--line2);position:relative;overflow:hidden}
.today::after{content:'';position:absolute;inset:-40% -20% auto auto;width:70%;height:120%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(var(--hotRGB),.14),transparent)}
.trow{display:flex;justify-content:space-between;align-items:center}
.pill{font-size:10px;font-weight:700;letter-spacing:.12em;padding:4px 9px;border-radius:999px;
  background:var(--hotdim);color:var(--hot2);border:1px solid rgba(var(--hotRGB),.35)}
.tval{font-size:clamp(34px,10.5vw,44px);font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:4px;color:var(--ink)}

<script>
/* Boot guard. A blank screen tells you nothing, and you cannot open devtools on
   a phone. Anything that stops the app starting now prints why, on screen. */
(function(){
  var shown=false;
  function fail(what,detail){
    if(shown)return; shown=true;
    var a=document.getElementById('app');
    if(!a||a.innerHTML.trim())return;
    a.innerHTML='<div style="padding:26px 22px;font:14px/1.65 system-ui,sans-serif;color:#EAE7E1">'
      +'<div style="font-weight:700;font-size:17px;color:#FF7A3D;margin-bottom:14px">Ledger could not start</div>'
      +'<div style="color:#A3AAB8;margin-bottom:18px">'+what+'</div>'
      +'<div style="font:12px/1.6 ui-monospace,monospace;color:#858C9A;background:#1D2027;'
      +'border:1px solid #282C35;border-radius:10px;padding:12px;word-break:break-word">'+detail+'</div>'
      +'<div style="color:#858C9A;font-size:12.5px;margin-top:18px">Most often this means <b style="color:#EAE7E1">'
      +'index.html did not upload completely</b>. Open the file on GitHub — it should read about <b style="color:#EAE7E1">'
      +'92 KB</b> and roughly 1,600 lines. If it reads far less, re-upload the file itself rather than pasting its text.</div>'
      +'</div>';
  }
  window.addEventListener('error',function(e){
    fail('A script error stopped it before it could draw anything.',
         String((e&&e.message)||'Unknown error'));
  });
  // Catches a silent hang too, not just a thrown error.
  setTimeout(function(){ fail('It loaded but never finished starting up.','Timed out after 6 seconds.'); },6000);
})();
</script>

<script>

try{

/* ══════════════════ 0. UTIL ══════════════════ */
const $=(s,r=document)=>r.querySelector(s);
/* Maps keyed by user-supplied strings must not inherit from Object.prototype:
   a category named "constructor" would otherwise resolve to a function, and
   assigning to a "__proto__" key is silently ignored, losing the entry. */
const nullMap=(o)=>Object.assign(Object.create(null),o||{});
/* Single place that rebuilds the category index, so every path gets the
   null-prototype map. An earlier audit fixed this at some call sites by pattern
   and missed the ones that used a different variable name. */
function setCats(list){
  CATS=list.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
  CATMAP=nullMap(Object.fromEntries(CATS.map(x=>[x.id,x])));
  DATA_VER++;
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
const now=()=>new Date().toISOString();
const pad2=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>dstr(new Date());
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return dstr(d);};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const money=n=>{const v=Math.round(n||0);return v.toLocaleString('en-IN');};
const money2=n=>Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const monKey=s=>s.slice(0,7);
const monLabel=k=>{const[y,m]=k.split('-');return MON[+m-1]+" '"+y.slice(2);};
/* created_at / updated_at are stored as UTC (toISOString), which is correct —
   an instant needs a zone. But slicing that string and printing it shows UTC
   as though it were local: an entry saved at 15:12 IST rendered as 09:42.
   Parse it back to a Date and format in the device's own zone. */
const localTs=iso=>{
  if(!iso)return '';
  const d=new Date(iso);
  if(isNaN(d.getTime()))return String(iso).slice(0,16).replace('T',' ');
  const t=pad2(d.getHours())+':'+pad2(d.getMinutes());
  const ds=dstr(d);
  if(ds===today())return 'today '+t;
  if(ds===addDays(today(),-1))return 'yesterday '+t;
  return ds+' '+t;
};
const dayLabel=s=>{const d=parseD(s),t=today();
  if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';
  return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+(monKey(s)!==monKey(t)?' '+d.getFullYear():'');};

function toast(msg){const o=$('.toast');if(o)o.remove();
  const e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);
  setTimeout(()=>e.remove(),1900);}
function buzz(ms=8){try{navigator.vibrate&&navigator.vibrate(ms)}catch{}}

/* NN/g: don't spend confirmation dialogs on routine actions — they get
   click-through fatigue and stop working. Offer recovery instead. Deletes are
   already soft, so undo is a one-field flip. */
function toastUndo(msg,onUndo){
  const o=$('.toast');if(o)o.remove();
  const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');
  e.innerHTML=`<span>${esc(msg)}</span><button class="undo">Undo</button>`;
  document.body.appendChild(e);
  const kill=setTimeout(()=>e.remove(),6000);
  e.querySelector('.undo').onclick=()=>{clearTimeout(kill);e.remove();onUndo();};
}

/* ══════════════════ 1. STORAGE ══════════════════
   IndexedDB, schema shaped exactly like the SQL you'll port to Postgres/Room.
   Falls back to an in-memory store if IDB is blocked (e.g. sandboxed preview). */
/* FUTURE — schema migrations. onupgradeneeded currently only creates stores.
   Before SCHEMA_VERSION goes to 2, add a version-keyed migration ladder there
   (v1→v2, v2→v3 …) that runs inside the upgrade transaction, and have doImport
   refuse a backup whose schema is newer than this build rather than importing
   it half-understood. */
const SCHEMA_VERSION=1;
/* FUTURE — this wrapper is deliberately thin. If a Postgres replica happens,
   the cleanest shape is an outbox table here: every mutation appends an intent
   row, a sync worker drains it, and failed pushes retry without the UI knowing.
   That keeps writes local-first and offline-safe by construction. */
const DB={
  db:null, mem:null,
  async open(){
    try{
      this.db=await new Promise((res,rej)=>{
        const r=indexedDB.open('ledger',SCHEMA_VERSION);
        r.onerror=()=>rej(r.error);
        r.onblocked=()=>rej(new Error('blocked'));
        r.onupgradeneeded=e=>{
          const db=e.target.result;
          if(!db.objectStoreNames.contains('expenses')){
            const s=db.createObjectStore('expenses',{keyPath:'id'});
            s.createIndex('by_date','spent_on');
            s.createIndex('by_cat','category_id');
          }
          if(!db.objectStoreNames.contains('categories'))db.createObjectStore('categories',{keyPath:'id'});
          if(!db.objectStoreNames.contains('rules'))db.createObjectStore('rules',{keyPath:'token'});
          if(!db.objectStoreNames.contains('meta'))db.createObjectStore('meta',{keyPath:'k'});
        };
        r.onsuccess=()=>res(r.result);
        setTimeout(()=>rej(new Error('timeout')),4000);
      });
    }catch(err){
      console.warn('IndexedDB unavailable, using volatile memory store:',err);
      this.mem={expenses:new Map(),categories:new Map(),rules:new Map(),meta:new Map()};
    }
    return !!this.db;
  },
  _tx(store,mode){return this.db.transaction(store,mode,{durability:'strict'});},
  async all(store){
    if(this.mem)return[...this.mem[store].values()];
    return new Promise((res,rej)=>{const r=this._tx(store,'readonly').objectStore(store).getAll();
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  },
  async get(store,key){
    if(this.mem)return this.mem[store].get(key)||null;
    return new Promise((res,rej)=>{const r=this._tx(store,'readonly').objectStore(store).get(key);
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);});
  },
  /* atomic multi-record put: all rows land or none do */
  async put(store,rows){
    rows=Array.isArray(rows)?rows:[rows];
    if(this.mem){rows.forEach(r=>this.mem[store].set(r[keyOf(store)],r));return;}
    return new Promise((res,rej)=>{
      const tx=this._tx(store,'readwrite'),os=tx.objectStore(store);
      rows.forEach(r=>os.put(r));
      tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);
    });
  },
  async del(store,key){
    if(this.mem){this.mem[store].delete(key);return;}
    return new Promise((res,rej)=>{const tx=this._tx(store,'readwrite');
      tx.objectStore(store).delete(key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});
  }
};
const keyOf=s=>s==='rules'?'token':s==='meta'?'k':'id';

/* Durability: ask the browser to never evict us. Granted for installed PWAs. */
/* FUTURE — encryption at rest. IndexedDB is plaintext on disk; anything with
   device access can read it. WebCrypto with a passphrase-derived key (PBKDF2 →
   AES-GCM) would fix that, at the cost of a passphrase prompt on every cold
   start. Worth it only once income and investment figures live here. */
async function requestPersist(){
  if(!navigator.storage||!navigator.storage.persist)return null;
  try{
    if(await navigator.storage.persisted())return true;
    return await navigator.storage.persist();
  }catch{return null;}
}

/* ══════════════════ 2. CATEGORIES + AUTO-CATEGORISER ══════════════════ */
/* FUTURE — categories, seed keywords and currency are all India-first and
   hardcoded. Locale support means at minimum: currency symbol and grouping
   from Intl, a swappable keyword pack, and week-start configurable (the
   calendar heatmap assumes Sunday). */
const SEED_CATS=[
  ['food','Food & Dining','#C4703C'],   ['groc','Groceries','#7FD1AE'],
  ['fuel','Fuel','#F5B942'],            ['trans','Transport','#6FA8DC'],
  ['bills','Bills & Recharge','#C58AF9'],['rent','Rent','#E5484D'],
  ['util','Utilities','#5EC7C7'],        ['health','Health','#F58CA8'],
  ['shop','Shopping','#9BE07A'],         ['subs','Subscriptions','#8A7BF0'],
  ['travel','Travel','#4FD1C5'],         ['ent','Entertainment','#FF9EC4'],
  ['edu','Education','#B0A0FF'],         ['care','Personal Care','#FFCB6B'],
  ['gift','Gifts & Donations','#FF8A5B'],['biz','Business','#A0AEC0'],
  ['misc','Misc','#6B7280']
];
/* Seed keywords — India-first. These are the cold-start priors; the learned
   rules below override them the moment you correct a guess. */
const SEED_KW={
  food:'swiggy zomato restaurant lunch dinner breakfast cafe coffee tea snack hotel dhaba pizza burger biryani meal canteen chai bakery mess',
  groc:'grocery groceries bigbasket dmart kirana vegetables veggies sabzi milk dairy blinkit zepto instamart supermarket atta rice dal provision',
  fuel:'petrol diesel fuel hp indianoil bharat pump cng gas',
  trans:'ola uber auto rapido taxi cab bus metro train ticket toll parking rickshaw fastag irctc',
  bills:'recharge jio airtel vi bsnl mobile broadband wifi postpaid prepaid dth internet',
  rent:'rent lease maintenance society landlord deposit',
  util:'electricity power bill water gas cylinder lpg indane sewage municipal tax',
  health:'medicine pharmacy apollo doctor hospital clinic medical lab test consult dental checkup pharmeasy tablets',
  shop:'amazon flipkart myntra clothes shirt shoes shopping mall meesho ajio electronics gadget',
  subs:'netflix spotify prime hotstar subscription youtube membership saas domain hosting adobe icloud openai claude',
  travel:'flight hotel booking oyo airbnb trip tour luggage indigo vistara makemytrip goibibo',
  ent:'movie cinema pvr inox game concert event bookmyshow outing',
  edu:'course book fees tuition exam college udemy coursera stationery notebook',
  care:'salon haircut barber gym spa cosmetics grooming laundry',
  gift:'gift donation charity temple wedding return chanda',
  biz:'client office print visiting card courier sample vendor stationery supplier freight transport gst'
};
const STOP=new Set('for the and with from that this was are you our not but all any per via got had has have out off into onto near then than some more less had rs inr amount paid pay bought buy get one two'.split(' '));
let CATS=[],CATMAP=Object.create(null);
function tokenize(s){
  return String(s||'').toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(t=>t.length>=3&&!STOP.has(t)&&!/^\d+$/.test(t));
}
let KWIDX=null;
function kwIndex(){
  if(KWIDX)return KWIDX;KWIDX={};
  for(const c in SEED_KW)for(const w of SEED_KW[c].split(' '))if(w)KWIDX[w]=c;
  return KWIDX;
}
let RULES=new Map();
/* Guess = learned rules first (weighted by how often you confirmed them),
   seed keywords second. Returns null when it has no idea. */
/* FUTURE — the categoriser is a bag-of-words vote. Cheap wins in order:
   bigrams ("blue diamond" as one token), TF-IDF so common words carry less
   weight, and a confidence threshold below which it asks rather than guesses.
   A small on-device embedding model would beat all three but breaks the
   zero-dependency offline guarantee, so it is not obviously worth it. */
function guessCategory(desc){
  const toks=tokenize(desc);if(!toks.length)return null;
  const score={};
  for(const t of toks){
    const r=RULES.get(t);
    if(r)for(const c in r.counts)score[c]=(score[c]||0)+r.counts[c]*3;
  }
  const idx=kwIndex();
  for(const t of toks){
    if(idx[t])score[idx[t]]=(score[idx[t]]||0)+2;
    else for(const w in idx){if(w.length>4&&t.includes(w)){score[idx[w]]=(score[idx[w]]||0)+1;break;}}
  }
  let best=null,bv=0;

async function learn(desc,catId){
  const toks=[...new Set(tokenize(desc))];if(!toks.length)return;
  const rows=toks.map(t=>{
    const r=RULES.get(t)||{token:t,counts:{}};
    r.counts[catId]=(r.counts[catId]||0)+1;RULES.set(t,r);return r;
  });
  await DB.put('rules',rows);

/* ── Natural-language quick entry ──────────────────────────────
   Habit research (BJ Fogg, via budgeting-app retention studies) is blunt:
   an action needing more than about two steps to initiate doesn't stick.
   Four fields per expense is where these apps die. So: one text box.
   "swiggy dinner 480", "480 petrol", "yesterday 2000 rent" all parse.       */
const REL_DATE=[
  [/\byesterday\b|\byday\b|\bkal\b/i,-1],[/\btoday\b/i,0],
  [/\bday before\b|\bdbf\b/i,-2],[/\b2 days ago\b/i,-2],[/\b3 days ago\b/i,-3]

/* FUTURE — the parser handles one entry per line. Splitting on ";" or "and"
   would let a whole day be logged in one field ("chai 20; auto 60; lunch 240").
   Also unhandled: other currencies, and "500 each" style multipliers. */
/* Payment method. Optional, and parsed from the text when present ("lunch 120
   upi"). Worth tracking in India specifically: in an IIIT Delhi study of UPI
   users, 74.2% reported spending more because of UPI and 59.8% admitted
   overspending linked to it — the intangibility of a scan removes the small
   pain of handing over cash. With methods recorded, the gap can be measured
   for you rather than assumed. */
const METHODS={upi:'UPI',cash:'Cash',card:'Card'};
const METHOD_RE=[[/\b(upi|gpay|g pay|google pay|phonepe|phone pe|paytm|bhim)\b/i,'upi'],
  [/\bcash\b/i,'cash'],[/\b(card|credit card|debit card|cc)\b/i,'card']];
function parseEntry(text){
  let s=' '+String(text||'')+' ',date=null,method=null;
  for(const [re,mth] of METHOD_RE)if(re.test(s)){method=mth;s=s.replace(re,' ');break;}
  for(const [re,off] of REL_DATE)if(re.test(s)){date=addDays(today(),off);s=s.replace(re,' ');break;}
  // "12 aug" / "3rd" style day references
  const dm=s.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)\b/i);
  if(dm){const y=new Date().getFullYear(),mo=MON.findIndex(m=>m.toLowerCase()===dm[2].toLowerCase());
    let c=y+'-'+pad2(mo+1)+'-'+pad2(+dm[1]);
    if(c>today())c=(y-1)+'-'+pad2(mo+1)+'-'+pad2(+dm[1]);
    if(/^\d{4}-\d{2}-\d{2}$/.test(c)){date=c;s=s.replace(dm[0],' ');}}

  // Indian grouping: 2,500 and 1,23,456 use commas as THOUSANDS separators.
  // An earlier version treated the comma as a decimal point, so "rs 2,500"
  // parsed as ₹2.50 — exactly the kind of silent corruption that poisons every
  // downstream statistic. Commas are stripped, never reinterpreted.
  const NUM='\\d+(?:,\\d{2,3})*(?:\\.\\d{1,2})?';
  let amount=null,mAmt=s.match(new RegExp('(?:₹|\\brs\\.?\\s*)\\s*('+NUM+')\\s*(k)?\\b','i'));
  if(!mAmt){const all=[...s.matchAll(new RegExp('(?<![\\w.])('+NUM+')\\s*(k)?(?![\\w])','gi'))];
    if(all.length)mAmt=all[all.length-1];}
  if(mAmt){amount=parseFloat(String(mAmt[1]).replace(/,/g,''));
    if(mAmt[2])amount*=1000;
    s=s.replace(mAmt[0],' ');}
  const desc=s.replace(/[₹]|\brs\.?\b/gi,' ').replace(/\s+/g,' ').trim();
  const g=guessCategory(desc);
  return{amount,desc,date:date||today(),cat:g?g.cat:null,dateExplicit:!!date,method};
}
/* One-tap repeat: your genuinely repeated purchases, most recent first. */
/* "Log again" chips.
   Amount is the typical (median) price for that item, not the most recent one —
   otherwise a single unusually expensive purchase becomes the suggested price
   for every repeat after it. Ordering favours items you tend to log around this time of day,
   so breakfast surfaces in the morning and dinner at night. */
function frequents(limit=6){
  const g=nullMap(), hr=new Date().getHours();
  for(const e of live()){
    const k=(e.description||'').toLowerCase().trim();
    if(k.length<3)continue;
    const o=(g[k]??={n:0,last:'',amts:[],cat:e.category_id,label:e.description,near:0});
    o.n++;o.amts.push(e.amount);
    if(e.spent_on>o.last){o.last=e.spent_on;o.cat=e.category_id;o.label=e.description;}
    const h=new Date(e.created_at).getHours();
    if(!isNaN(h)){const d=Math.abs(h-hr);if(Math.min(d,24-d)<=2)o.near++;}
  }
  const t=today();
  return Object.values(g).filter(x=>x.n>=2).map(x=>{
    const amt=Math.round(quantile(x.amts.slice().sort((a,b)=>a-b),.5));
    const recency=Math.max(0,30-daysBetween(x.last,t))/30;
    return{...x,amt,score:(x.near/x.n)*3+recency+Math.min(1,x.n/10)};
  }).sort((a,b)=>b.score-a.score).slice(0,limit);
}
/* Typical price for a description you've logged before — used as a visible,
   overridable default when you type an item without an amount. Defaults are
   sticky, so this is only offered once there are at least two prior entries. */
function typicalFor(desc){
  const k=(desc||'').toLowerCase().trim();
  if(k.length<3)return null;
  const a=live().filter(e=>(e.description||'').toLowerCase().trim()===k).map(e=>e.amount).sort((x,y)=>x-y);
  return a.length>=2?Math.round(quantile(a,.5)):null;
}

/* ══════════════════ 3. ANALYTICS ══════════════════ */
/* Read-only viewer, for opening a backup on a laptop.
   Deliberately read-only. IndexedDB is per-device, so a laptop copy would be a
   second writable database with no sync between them — edit on both and one
   set of changes is silently lost the next time you import. A viewer that
   never writes cannot diverge, so the phone stays the single source of truth. */
let READONLY=false;
let DATA_VER=0;                     // bumped on every change to entries or categories
let EXP=[];                                    // live cache, non-deleted, date-desc
/* A category can be marked a transfer — money moved, not money gone (an RD
   deposit, a savings transfer). Counting those as spending would understate
   savings twice over: subtracted as an expense AND missing from what's left.
   So every spending analytic reads live(); only the Log shows liveAll(). With
   no category flagged, the two are identical and nothing changes. */
const isTransfer=e=>!!(CATMAP[e.category_id]&&CATMAP[e.category_id].is_transfer);
/* Fixed-cost categories. Recurring detection needs repeated evidence, so rent —
   the largest commitment most people have — would not count as committed until
   its third payment — so for the first two months of use the app would report
   almost nothing as fixed while rent was most of the spending.
   A category flagged fixed counts as committed from its first entry, needs only
   two occurrences to be forecast, and is kept out of the daily allowance and
   out of outlier detection. Rent, bills, utilities and subscriptions default on. */
const FIXED_DEFAULT=new Set(['rent','bills','util','subs']);
const isFixedCat=id=>!!(CATMAP[id]&&CATMAP[id].is_fixed);
const liveAll=()=>EXP.filter(e=>!e.deleted_at);
const live=()=>EXP.filter(e=>!e.deleted_at&&!isTransfer(e));
const transfers=()=>EXP.filter(e=>!e.deleted_at&&isTransfer(e));
function sum(a){return a.reduce((s,e)=>s+e.amount,0);}

/* Tracking began on the first logged day, not on the first of that month.
   Days before it have no data — and treating "no data" as "zero spending" is how
   a first month covering only a few days produces an absurd month-on-month
   jump, a deflated "typical month" in the savings projection, and 100% savings rates for months before the
   app was installed. Every comparison and projection now checks coverage first. */
let _tsCache=null,_tsVer=-1;
function trackStart(){
  if(_tsVer===DATA_VER)return _tsCache;
  _tsCache=liveAll().map(e=>e.spent_on).sort()[0]||null;_tsVer=DATA_VER;
  return _tsCache;
}
/* Fraction of month k's elapsed days that fall on or after tracking began. */
function coverage(k){
  const ts=trackStart();if(!ts)return 0;
  const [y,m]=k.split('-').map(Number), dim=new Date(y,m,0).getDate();
  const first=k+'-01', last=k+'-'+pad2(dim), end=last<today()?last:today();
  if(end<first||ts>end)return 0;
  const from=ts>first?ts:first;
  return (daysBetween(from,end)+1)/(daysBetween(first,end)+1);
}
const fullMonth=k=>coverage(k)>=0.9;

function monthStats(key){
  const rows=live().filter(e=>monKey(e.spent_on)===key);
  const total=sum(rows);
  const [y,m]=key.split('-').map(Number);
  const dim=new Date(y,m,0).getDate();
  const isCur=key===monKey(today());
  // days actually tracked: from tracking start (if it fell in this month) to today/month end
  const ts=trackStart(), first=key+'-01';
  const endDay=isCur?new Date().getDate():dim;
  const startDay=(ts&&ts>first&&monKey(ts)===key)?parseD(ts).getDate():1;
  const elapsed=Math.max(1,endDay-startDay+1);
  const byCat=nullMap();for(const e of rows)byCat[e.category_id]=(byCat[e.category_id]||0)+e.amount;
  const daily=Array(dim).fill(0);for(const e of rows)daily[parseD(e.spent_on).getDate()-1]+=e.amount;
  return{key,rows,total,count:rows.length,dim,elapsed,isCur,byCat,daily,
    perDay:elapsed?total/elapsed:0, projected:isCur&&elapsed?total/elapsed*dim:total};
}
function last12(){
  const out=[],d=new Date();d.setDate(1);
  for(let i=11;i>=0;i--){const t=new Date(d.getFullYear(),d.getMonth()-i,1);
    const k=t.getFullYear()+'-'+pad2(t.getMonth()+1);
    out.push({key:k,total:sum(live().filter(e=>monKey(e.spent_on)===k))});}
  return out;
}
function dowPattern(){
  const s=Array(7).fill(0),c=Array(7).fill(0),seen=nullMap();
  for(const e of live()){const d=parseD(e.spent_on).getDay();s[d]+=e.amount;
    if(!seen[e.spent_on]){seen[e.spent_on]=1;c[d]++;}}
  return s.map((v,i)=>c[i]?v/c[i]:0);
}

/* Recurring / subscription detection.
   Group by description signature → require >=3 hits, a stable gap and a
   stable amount. Reports cadence, next expected date and overdue flag. */
const CADENCE=[[7,'Weekly',2],[14,'Fortnightly',3],[30,'Monthly',6],[91,'Quarterly',12],[182,'Half-yearly',20],[365,'Yearly',35]];
function signature(e){
  const t=tokenize(e.description);
  if(!t.length)return 'cat:'+e.category_id;
  return t.slice(0,2).sort().join(' ');
}
/* Memoised: O(n log n) with tokenisation over every entry, and seven call sites
   hit it on a single render of Trends or Money. Invalidated by DATA_VER, which
   every mutation bumps. */
let _recCache=null,_recVer=-1;
let _manIds=new Set();
function detectRecurring(){
  if(_recCache&&_recVer===DATA_VER)return _recCache;
  const man=manualRecurring(), mine=new Set(man.out.map(r=>r.sig));
  _manIds=man.ids;
  // a hand-added commitment replaces whatever detection found for the same payments,
  // so nothing is counted twice
  const auto=_detectRecurring().filter(r=>!mine.has(r.sig)&&
    r.entries.filter(e=>man.ids.has(e.id)).length<r.entries.length/2);
  _recCache=[...man.out,...auto].sort((a,b)=>b.monthly-a.monthly);_recVer=DATA_VER;
  return _recCache;
}
function manualIds(){detectRecurring();return _manIds;}

/* ── Commitments added by hand ──
   For payments detection can't see yet: a new rent agreement, an SIP, an annual
   premium that has only happened once. Stored as data, so they travel with a
   backup, and soft-deleted like entries so an older backup can't resurrect one.
   Each joins the recurring list at full confidence, which means it feeds the
   daily allowance, the forward view and every committed total exactly like a
   detected one.
   Monthly dates are stepped by calendar month from the original due date, not by
   30 days, so a payment due on the 1st stays on the 1st, and one due on the 31st
   lands on the last day of shorter months without drifting. */
let COMMITS=[];
const MCAD={weekly:{name:'Weekly',days:7,per:52},monthly:{name:'Monthly',months:1,per:12},
  quarterly:{name:'Quarterly',months:3,per:4},yearly:{name:'Yearly',months:12,per:1}};
const activeCommits=()=>COMMITS.filter(c=>!c.deleted_at);
function occ(anchor,c,i){
  if(c.days)return addDays(anchor,c.days*i);
  const [y,m,d]=anchor.split('-').map(Number);
  const t=new Date(y,m-1+c.months*i,1), dim=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return t.getFullYear()+'-'+pad2(t.getMonth()+1)+'-'+pad2(Math.min(d,dim));
}
function occAfter(anchor,c,d){         // first occurrence strictly after d
  let i=0,x=anchor;while(x<=d&&i<5000)x=occ(anchor,c,++i);return x;
}
const stepRec=(r,d)=>r.cad?occAfter(r.anchor,r.cad,d):addDays(d,r.gap);
const commitNext=m=>{const c=MCAD[m.cadence]||MCAD.monthly;return m.next>=today()?m.next:occAfter(m.next,c,addDays(today(),-1));};
function manualRecurring(){
  const t=today(), cutoff=addDays(t,-420), out=[], ids=new Set();
  for(const m of activeCommits()){
    const c=MCAD[m.cadence]||MCAD.monthly, cat=CATMAP[m.cat]?m.cat:'misc';
    const gap=c.days||Math.round(c.months*30.4), early=Math.max(2,Math.round(gap/4));
    const sig=signature({description:m.label,category_id:cat});
    // a logged payment counts if it reads the same, or sits in the same category at about this amount
    const ents=live().filter(e=>e.spent_on>=cutoff&&(signature(e)===sig||
      (e.category_id===cat&&Math.abs(e.amount-m.amount)<=m.amount*0.15)))
      .sort((a,b)=>a.spent_on<b.spent_on?-1:1);
    for(const e of ents)ids.add(e.id);
    let i=0,prev=null,d=m.next;
    while(d<t&&i<5000){prev=d;d=occ(m.next,c,++i);}
    const paidFor=x=>ents.some(e=>e.spent_on>=addDays(x,-early)&&e.spent_on<=t);
    let next=d,overdue=false;
    if(prev&&!paidFor(prev)){next=prev;overdue=true;}       // came due, nothing logged
    else if(paidFor(d))next=occ(m.next,c,i+1);              // already paid ahead of the date
    out.push({manual:true,id:m.id,anchor:m.next,cad:c,entries:ents,sig,label:m.label,cat,
      n:ents.length,cadence:c.name,gap,mean:m.amount,min:m.amount,max:m.amount,stable:true,
      last:ents.length?ents[ents.length-1].spent_on:null,next,overdue,expect:m.amount,
      monthly:m.amount*c.per/12,fixedCat:isFixedCat(cat),confidence:100});
  }
  return{out,ids};
}
const validCommit=c=>c&&typeof c.id==='string'&&typeof c.label==='string'&&c.label.trim().length>0&&
  c.label.length<=60&&isFinite(c.amount)&&c.amount>0&&MCAD[c.cadence]&&/^\d{4}-\d{2}-\d{2}$/.test(c.next||'')&&
  typeof c.cat==='string';
async function saveCommits(list){
  const prev=COMMITS;COMMITS=list;DATA_VER++;
  try{await DB.put('meta',{k:'commits',v:JSON.stringify(COMMITS)});}
  catch(e){if(COMMITS===list){COMMITS=prev;DATA_VER++;}throw e;}   // roll back only our own change
}
/* FUTURE — detection is median-gap plus amount stability, which is robust and
   explainable but misses two real cases: charges that shift weekday (last
   Friday of the month), and cadences that changed partway (monthly → annual
   billing). Proper seasonal decomposition would catch both. Explainability is
   worth keeping — a user should be able to see why something was flagged. */
function _detectRecurring(){
  const cutoff=addDays(today(),-420);
  const groups=nullMap();
  for(const e of live()){if(e.spent_on<cutoff)continue;(groups[signature(e)]??=[]).push(e);}
  const out=[];
  for(const sig in groups){
    const g=groups[sig].slice().sort((a,b)=>a.spent_on<b.spent_on?-1:1);
    const fixedCat=g.every(e=>isFixedCat(e.category_id));
    if(g.length<(fixedCat?2:3))continue;
    const gaps=[];for(let i=1;i<g.length;i++)gaps.push(daysBetween(g[i-1].spent_on,g[i].spent_on));
    if(gaps.some(x=>x===0))continue;
    const sorted=gaps.slice().sort((a,b)=>a-b);
    const med=sorted[Math.floor(sorted.length/2)];
    const hit=CADENCE.find(([d,,tol])=>Math.abs(med-d)<=tol);
    if(!hit)continue;
    const [,name,tol]=hit;
    const okGaps=gaps.filter(x=>Math.abs(x-med)<=Math.max(tol,med*.35)).length;
    if(okGaps/gaps.length<0.6)continue;
    /* Gap regularity. A habit logged now and then (breakfast on days 0, 7, 12, 32)
       can land on a weekly median gap by coincidence; a real subscription does
       not wander. Require tight gaps, and more occurrences for short cadences,
       where coincidences are cheap. */
    const gm=gaps.reduce((a,b)=>a+b,0)/gaps.length;
    const gcv=gm?Math.sqrt(gaps.reduce((t,x)=>t+(x-gm)**2,0)/gaps.length)/gm:1;
    if(gcv>0.35&&okGaps/gaps.length<0.8)continue;
    const minN=med<=10?5:med<=20?4:(fixedCat?2:3);
    if(g.length<minN)continue;
    const amts=g.map(e=>e.amount),mean=amts.reduce((a,b)=>a+b,0)/amts.length;
    const sd=Math.sqrt(amts.reduce((s,a)=>s+(a-mean)**2,0)/amts.length);
    const cv=mean?sd/mean:1;
    if(cv>0.45)continue;
    const last=g[g.length-1].spent_on, next=addDays(last,med);
    /* Expected next amount. The mean of history lags a price change — after a
       rent change it forecasts the average of the old and new amounts. For a
       fixed cost the latest amount is the best predictor; otherwise the median
       of the last three, which follows a change without chasing one outlier. */
    const tail=amts.slice(-3).sort((a,b)=>a-b);
    const expect=fixedCat?amts[amts.length-1]:tail[Math.floor(tail.length/2)];
    const overdue=daysBetween(next,today())>Math.max(3,med*.15);
    out.push({
      entries:g,
      sig, label:g[g.length-1].description||CATMAP[g[0].category_id].name,
      cat:g[g.length-1].category_id, n:g.length, cadence:name, gap:med,
      mean, min:Math.min(...amts), max:Math.max(...amts), stable:cv<0.08,
      last, next, overdue, expect, monthly:expect*(30/med),
      fixedCat,
      // a category the user declared fixed is evidence in itself, so it needs fewer repeats
      confidence:Math.min(99,Math.round((okGaps/gaps.length)*(1-cv)*100*Math.min(1,g.length/(fixedCat?3:5))+8))
    });
  }
  return out.sort((a,b)=>b.monthly-a.monthly);
}

/* ══════════════════ 3a. INCOME ══════════════════
   Stored as a monthly take-home figure plus optional per-month overrides,
   because income here is "mostly steady with minor variation" — a single
   estimate covers the norm, an override covers the month that wasn't.
   Take-home rather than gross: tax and deductions never reach the account, so
   including them would flatter the savings rate and make safe-to-spend wrong. */
let INCOME={monthly:0,period:'month',overrides:{}};
/* Per-device UI preferences. Kept separate from data so a backup restore never
   overrides how this phone is set up. */
let PREFS={theme:'auto',accent:'ember',lastMethod:null,recapSeen:null};
async function savePrefs(next){
  PREFS={...PREFS,...next};
  try{await DB.put('meta',{k:'prefs',v:JSON.stringify(PREFS)});}catch(e){console.warn('prefs not saved',e);}
}
/* Savings goal as a fraction of income. Defaults to 20%, the savings share in
   the common 50/30/20 split. Defaults are sticky — most people never change
   them — so this one points somewhere useful, and it is shown wherever it
   affects a number so it is never invisible. */
/* Resolved colours for SVG charts. Charts are SVG strings built in JS; CSS

    ink:g('ink'),mute:g('mute'),dim:g('dim'),line:g('line'),line2:g('line2'),bg:g('bg'),

}
const ACCENTS={ember:'#FF7A3D',lime:'#A3E635',violet:'#A78BFA',ocean:'#38BDF8'};
let _mq=null;
function resolvedTheme(){

    _mq.addEventListener('change',()=>{if(PREFS.theme==='auto'){applyTheme();render();}});}catch{}}
}
const goalPct=()=>INCOME.goalPct===undefined||INCOME.goalPct===null?0.2:INCOME.goalPct;
const incomeFor=k=>{
  const o=INCOME.overrides&&INCOME.overrides[k];
  return (o===undefined||o===null)?(INCOME.monthly||0):o;
};
const hasIncome=()=>(INCOME.monthly||0)>0||Object.keys(INCOME.overrides||{}).length>0;

async function saveIncome(next){

}

/* Everything the Money tab needs for one month. */
/* FUTURE — income is one figure plus overrides. Natural extensions: multiple
   income streams (salary vs incentive) so variable pay can be tracked
   separately; a savings goal with a projected hit date; and an optional
   expected-return rate so projections compound rather than accumulate flat.
   The rate must be user-supplied — inventing one would be inventing a number. */
function moneyFor(k){
  const inc=incomeFor(k);
  const st=monthStats(k);
  const fv=fixedVsVariable(k);
  const tr=transfers().filter(e=>monKey(e.spent_on)===k).reduce((s,e)=>s+e.amount,0);
  /* Two different quantities, easy to conflate:
       saved = income not spent — a transfer into an RD counts here, it IS saving
       left  = cash still unallocated — the transfer has left the account, so it does not
     Savings rate must use saved. Using left would punish you for investing. */
  const saved=inc-st.total;
  const left=inc-st.total-tr;
